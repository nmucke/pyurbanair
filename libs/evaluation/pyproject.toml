[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [{name = "Nikolaj T. Mücke", email = "nmucke@gmail.com"}]
# Leaf library: numerics, storage and plotting only. Deliberately no jax, no
# pyurbanair, no backend -- see the design rules in src/evaluation/__init__.py.
dependencies = [
    "numpy>=2.3.5,<3",
    "scipy>=1.16.3,<2",
    "xarray>=2025.12.0,<2026",
    "netcdf4>=1.7.3,<2",
    "matplotlib>=3.10.8,<4",
]
name = "evaluation"
requires-python = ">= 3.12,<3.13"
version = "0.1.0"

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.package.build]
backend = {name = "pixi-build-python", version = "*", channel = "https://prefix.dev/conda-forge" }

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

# Pixi dependencies
[tool.pixi.dependencies]
numpy = ">=2.3.5,<3"
scipy = ">=1.16.3,<2"
xarray = ">=2025.12.0,<2026"
netcdf4 = ">=1.7.3,<2"
matplotlib = ">=3.10.8,<4"

[tool.pixi.pypi-dependencies]
evaluation = { path = ".", editable = true }
