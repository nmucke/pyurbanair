[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyurbanair-mcp"
version = "0.1.0"
description = "Local MCP tools for reproducible pyurbanair forward simulations"
requires-python = ">=3.12,<3.13"
dependencies = ["pyurbanair", "mcp>=2,<3"]

[project.scripts]
pyurbanair-mcp = "pyurbanair_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyurbanair_mcp"]
