[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [{name = "Nikolaj T. Mücke", email = "nmucke@gmail.com"}]
dependencies = [
    "numpy>=2.3.5,<3",
    "torch>=2.4,<3",
    "neural_surrogates",
]
name = "neural_surrogate_baselines"
requires-python = ">= 3.12,<3.13"
version = "0.1.0"

# SSRollingUrbanNet wraps Microsoft Aurora (MIT). Imported lazily in
# ssrolling/aurora_adapter.py, so Local-FNO works without it. The pixi
# `baselines` feature installs it unconditionally (pinned there).
[project.optional-dependencies]
ssrolling = ["microsoft-aurora==2.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_surrogate_baselines"]
