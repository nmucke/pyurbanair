<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pyurbanair: pick an area</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #fff; color: #222; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
         border-bottom: 1px solid #ccc; }
  #map { flex: 1; }
  #map.drawing { cursor: crosshair; }
  button { font: inherit; padding: 4px 10px; }
  button.on { background: #2a6fdb; color: #fff; }
  #info { font-variant-numeric: tabular-nums; }
  #message.error { color: #b00020; }
  #message.ok { color: #1b7a2e; font-weight: 600; }
</style>
</head>
<body data-max-area-km2="__MAX_AREA_KM2__">
<div id="bar">
  <form id="search"><input id="query" placeholder="Search a place" size="22"> <button>Go</button></form>
  <button id="draw" type="button">Draw rectangle</button>
  <span id="info">Draw a rectangle (max __MAX_AREA_KM2__ km²).</span>
  <button id="use" type="button" disabled>Use this area</button>
  <span id="message"></span>
</div>
<div id="map"></div>
<script>
"use strict";
const maxArea = parseFloat(document.body.dataset.maxAreaKm2);
const map = L.map("map").setView([52.0116, 4.3571], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const drawButton = document.getElementById("draw");
const useButton = document.getElementById("use");
const info = document.getElementById("info");
const message = document.getElementById("message");
let rectangle = null, start = null, drawing = false, bbox = null;

// Same spherical formula as area_selector.bbox_area_km2.
function areaKm2(b) {
  const r = 6371.0088, rad = Math.PI / 180;
  return r * r * (b.east - b.west) * rad * (Math.sin(b.north * rad) - Math.sin(b.south * rad));
}

function say(text, kind) { message.textContent = text; message.className = kind || ""; }

function setDrawing(on) {
  drawing = on;
  drawButton.classList.toggle("on", on);
  document.getElementById("map").classList.toggle("drawing", on);
  if (on) map.dragging.disable(); else map.dragging.enable();
}

function update(bounds) {
  bbox = { west: bounds.getWest(), south: bounds.getSouth(),
           east: bounds.getEast(), north: bounds.getNorth() };
  const area = areaKm2(bbox), fits = area <= maxArea;
  info.textContent = `${area.toFixed(3)} km² · W ${bbox.west.toFixed(5)} S ${bbox.south.toFixed(5)}`
    + ` E ${bbox.east.toFixed(5)} N ${bbox.north.toFixed(5)}`;
  useButton.disabled = !fits;
  say(fits ? "" : `Too large: the maximum is ${maxArea} km².`, fits ? "" : "error");
  rectangle.setStyle({ color: fits ? "#2a6fdb" : "#b00020" });
}

drawButton.addEventListener("click", () => setDrawing(!drawing));
map.on("mousedown", (e) => {
  if (!drawing) return;
  start = e.latlng;
  if (rectangle) rectangle.remove();
  rectangle = L.rectangle(L.latLngBounds(start, start), { weight: 2 }).addTo(map);
});
map.on("mousemove", (e) => {
  if (drawing && start) update(L.latLngBounds(start, e.latlng));
});
map.on("mouseup", (e) => {
  if (!drawing || !start) return;
  update(L.latLngBounds(start, e.latlng));
  start = null;
  setDrawing(false);
});

useButton.addEventListener("click", async () => {
  useButton.disabled = true;
  say("Sending…");
  try {
    const response = await fetch("area", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bbox),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || response.statusText);
    say(`Area sent (${result.bbox.area_km2.toFixed(3)} km²). You can close this page and return to your assistant.`, "ok");
  } catch (err) {
    say(`Not accepted: ${err.message}`, "error");
  } finally {
    useButton.disabled = false;
  }
});

document.getElementById("search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("query").value.trim();
  if (!q) return;
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q);
    const hits = await (await fetch(url)).json();
    if (!hits.length) { say("No place found.", "error"); return; }
    const [s, n, w, e2] = hits[0].boundingbox.map(Number);
    map.fitBounds([[s, w], [n, e2]], { maxZoom: 16 });
    say("");
  } catch (err) {
    say(`Search failed: ${err.message}`, "error");
  }
});
</script>
</body>
</html>
