[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [{name = "Nikolaj T. Mücke", email = "nmucke@gmail.com"}]
# The MCP SDK is imported as `mcp`; only server.py imports it, so it is the
# `server` extra. Tools and jobs/ (preparation, supervisor, workers) stay
# SDK-free: the browser app (`ui` env) and the dev/cuda/rendering/city4cfd
# workers run them without the SDK installed.
dependencies = ["pyurbanair", "visualization", "psutil>=6,<8"]
description = "Local MCP tools for reproducible pyurbanair forward simulations"
name = "mcp-server"
requires-python = ">= 3.12,<3.13"
version = "0.1.0"

[project.optional-dependencies]
server = ["mcp>=2,<3"]

[project.scripts]
mcp-server = "mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
