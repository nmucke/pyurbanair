[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [{name = "Nikolaj T. Mücke", email = "nmucke@gmail.com"}]
dependencies = [
    "numpy>=2.3.5,<3",
    "xarray>=2025.12.0,<2026",
    "netcdf4>=1.7.3,<2",
    "torch>=2.4,<3",
]
name = "neural_surrogates"
requires-python = ">= 3.12,<3.13"
version = "0.1.0"

# The P3D architecture wraps the heavy `p3d_surrogate` package (it pulls in
# transformers/diffusers). It is imported lazily in architectures/p3d.py, so it
# is an optional extra rather than a hard dependency: only `pip install
# 'neural_surrogates[p3d]'` (or the pixi neural-surrogates feature) needs it.
[project.optional-dependencies]
p3d = ["p3d-surrogate>=0.0.4"]

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.package.build]
backend = {name = "pixi-build-python", version = "*", channel = "https://prefix.dev/conda-forge" }

[tool.hatch.build.targets.wheel]
packages = ["src/neural_surrogates"]

# No conda pytorch here: torch is resolved from PyPI (see [project]
# dependencies). The workspace pins the wheel variant per environment
# (+cpu / +cu126); a conda pytorch would pin pypi torch to the conda
# version and conflict with those variants.
[tool.pixi.dependencies]
xarray = ">=2025.12.0,<2026"
netcdf4 = ">=1.7.3,<2"
numpy = ">=2.3.5,<3"

[tool.pixi.pypi-dependencies]
neural-surrogates = { path = "libs/neural_surrogates", editable = true }
pyurbanair = { path = "../..", editable = true }
