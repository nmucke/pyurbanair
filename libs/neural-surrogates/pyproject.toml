[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [{name = "Nikolaj T. Mücke", email = "nmucke@gmail.com"}]
dependencies = [
    "numpy>=2.3.5,<3",
    "xarray>=2025.12.0,<2026",
    "netcdf4>=1.7.3,<2",
    "torch>=2.4,<3",
]
name = "neural_surrogates"
requires-python = ">= 3.12,<3.13"
version = "0.1.0"

# The P3D architecture wraps the heavy `p3d_surrogate` package (it pulls in
# transformers/diffusers). It is imported lazily in architectures/p3d.py, so it
# is an optional extra rather than a hard dependency: only `pip install
# 'neural_surrogates[p3d]'` (or the pixi neural-surrogates feature) needs it.
[project.optional-dependencies]
p3d = ["p3d-surrogate>=0.0.4"]
# LoRA / BaLoRA fine-tuning (neural_surrogates.finetuning). peft>=0.11 ships the
# lora.Conv3d layer P3D needs; imported lazily inside finetuning/ so the base
# package import stays light.
#
# Intentionally declared in TWO places (not a mistake to "fix"): this extra is for
# standalone `pip install neural_surrogates[finetuning]`, while the pixi dev/cuda
# environments pull peft in unconditionally via the `neural-surrogates` feature
# (root pyproject.toml) so the dev env always has it without opting into an extra.
finetuning = ["peft>=0.11"]
# Tadpole autoencoder pre-training (neural_surrogates.TadpoleAE, plan 02). The
# upstream `tadpole` package is NOT a dependency: only the autoencoder subtree is
# vendored under architectures/_tadpole/ (see its __init__ for the why -- upstream
# pulls in torchfsm -> vape4d, an unused, resolution-risky chain). This extra just
# names the vendored code's runtime deps (einops is already a base pixi dep); they
# are imported lazily inside TadpoleAE so the base package import stays light. The
# pixi dev/cuda envs already carry diffusers/timm transitively via p3d-surrogate.
tadpole = ["diffusers", "timm", "einops"]

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.package.build]
backend = {name = "pixi-build-python", version = "*", channel = "https://prefix.dev/conda-forge" }

[tool.hatch.build.targets.wheel]
packages = ["src/neural_surrogates"]

# No conda pytorch here: torch is resolved from PyPI (see [project]
# dependencies). The workspace pins the wheel variant per environment
# (+cpu / +cu126); a conda pytorch would pin pypi torch to the conda
# version and conflict with those variants.
[tool.pixi.dependencies]
xarray = ">=2025.12.0,<2026"
netcdf4 = ">=1.7.3,<2"
numpy = ">=2.3.5,<3"

[tool.pixi.pypi-dependencies]
neural-surrogates = { path = "libs/neural_surrogates", editable = true }
pyurbanair = { path = "../..", editable = true }
