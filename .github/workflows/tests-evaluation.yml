# tests/evaluation.
# Pull requests run it when the package or something it depends on changes;
# every push to main and a manual run (Actions tab) run it unconditionally.
name: "Tests: evaluation"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "libs/evaluation/**"
      - "tests/evaluation/**"
      - "src/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "tests/conftest.py"
      - "tests/legacy/**"
      - "scripts/setup_dev_env.sh"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-evaluation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Run tests
        run: pixi run -e dev python -m pytest tests/evaluation --durations=10
