# The tiny real-solver runs (`pixi run -e dev test-integration`): builds uDALES,
# LBM and PALM from a fresh checkout and runs them, on Linux and macOS.
# Slow, so pull requests run it only when something a real solver run depends
# on changes (a wrapper, its build or environment, the configs, the case
# geometries, the scripts the tests drive); it also runs nightly and on demand
# (Actions tab).
name: "Tests: integration"

on:
  pull_request:
    paths:
      - "libs/py*/**"
      - "activation_scripts/**"
      - "configs/**"
      - "geometries/**"
      - "scripts/**"
      - "src/pyurbanair/utils/**"
      - "tests/configs/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "conda-pypi-mapping.json"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-integration.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not macos-26: the macos-26 image of 2026-10-13 breaks the
        # solver links (docs/plans/ci_macos27_sdk_linker.md).
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Run the solver tests
        run: pixi run -e dev test-integration
      - name: No solver process outlives the tests
        if: always()
        run: |
          if pgrep -l -x 'u-dales|boltzmann|prterun|palm'; then
            exit 1
          fi
