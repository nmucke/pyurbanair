name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false

      # The root lockfile is versioned so CI and local MCP workers share the
      # same solved dependencies; editable library manifests also invalidate cache.
      - name: Cache pixi environment
        uses: actions/cache@v4
        with:
          path: .pixi/envs
          key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock', 'pyproject.toml', 'libs/**/pyproject.toml') }}

      # setup-dev, not `pixi install -e dev`: the first install hits the known
      # coreutils/tempest-remap bin/test clobber that the task works around.
      - name: Install dev environment
        run: pixi run setup-dev

      - name: Run tests
        # Hosted runners can expose UCX interfaces whose port-speed probing
        # raises SIGFPE during MPI_Init with the solvers' FP traps enabled.
        # Use portable transports for this single-host smoke suite.
        env:
          OMPI_MCA_pml: ob1
          OMPI_MCA_btl: self,sm,tcp
          # Tiny test tensors cost more to dispatch across threads than to
          # compute. These limits also apply in forkserver ensemble workers.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pixi run -e dev py.test

      - name: Install optional MCP environment
        run: pixi install --locked -e mcp

      - name: Verify MCP protocol and entry points
        run: pixi run --locked -e mcp python -m pytest tests/test_mcp_protocol.py
