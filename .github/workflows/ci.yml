name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false

      # Keyed on pyproject.toml, NOT pixi.lock: the lock file is gitignored, so
      # it does not exist in a fresh checkout and hashFiles() returned an empty
      # string -- leaving one immortal `pixi-Linux-` entry that no dependency
      # change ever invalidated. Restoring a months-old env on top of a fresh
      # (unpinned, and so drifting) solve is what broke the bin/test workaround.
      - name: Cache pixi environment
        uses: actions/cache@v4
        with:
          path: .pixi/envs
          key: pixi-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      # setup-dev, not `pixi install -e dev`: the first install hits the known
      # coreutils/tempest-remap bin/test clobber that the task works around.
      - name: Install dev environment
        run: pixi run setup-dev

      - name: Run tests
        # Hosted runners can expose UCX interfaces whose port-speed probing
        # raises SIGFPE during MPI_Init with the solvers' FP traps enabled.
        # Use portable transports for this single-host smoke suite.
        env:
          OMPI_MCA_pml: ob1
          OMPI_MCA_btl: self,tcp
        run: pixi run -e dev py.test
