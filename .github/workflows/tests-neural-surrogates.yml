# tests/neural_surrogates.
# Pull requests run it when the package or something it depends on changes;
# every push to main and a manual run (Actions tab) run it unconditionally.
name: "Tests: neural_surrogates"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "libs/neural-surrogates/**"
      - "libs/data-assimilation/**"
      - "libs/pyudales/**"
      - "tests/neural_surrogates/**"
      - "src/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "tests/conftest.py"
      - "scripts/setup_dev_env.sh"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-neural-surrogates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/neural_surrogates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Run tests
        run: pixi run -e dev python -m pytest tests/neural_surrogates --durations=10
