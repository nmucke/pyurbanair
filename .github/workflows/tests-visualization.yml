# tests/visualization.
# Pull requests run it when the package or something it depends on changes;
# every push to main and a manual run (Actions tab) run it unconditionally.
name: "Tests: visualization"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "libs/visualization/**"
      - "tests/visualization/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "tests/conftest.py"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-visualization.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/visualization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Run tests
        run: pixi run -e dev python -m pytest tests/visualization --durations=10
