# tests/pycity4cfd: map area -> OSM buildings -> City4CFD -> case overrides, in
# the city4cfd pixi environment. osmnx is mocked. Installing the env compiles
# City4CFD (a pixi source package, a few minutes per OS); the installed env is
# cached, so it recompiles only when the cache key (pixi.lock, the manifests)
# changes. The `integration` tests that run it are included.
# Pull requests run it when the package or something it depends on changes;
# every push to main or dev and a manual run (Actions tab) run it unconditionally.
name: "Tests: pycity4cfd"

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "libs/pycity4cfd/**"
      - "libs/mcp-server/src/mcp_server/jobs/**"
      - "tests/pycity4cfd/**"
      - "configs/**"
      - "src/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "tests/conftest.py"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-pycity4cfd.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/pycity4cfd (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          environment: city4cfd
      - name: Run tests
        run: pixi run --locked -e city4cfd python -m pytest tests/pycity4cfd -m '' --durations=10
