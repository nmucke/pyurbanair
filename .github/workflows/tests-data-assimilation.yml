# tests/data_assimilation.
# Pull requests run it when the package or something it depends on changes;
# every push to main and a manual run (Actions tab) run it unconditionally.
name: "Tests: data_assimilation"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "libs/data-assimilation/**"
      - "tests/data_assimilation/**"
      - "src/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "tests/conftest.py"
      - "scripts/setup_dev_env.sh"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-data-assimilation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/data_assimilation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Run tests
        run: pixi run -e dev python -m pytest tests/data_assimilation --durations=10
