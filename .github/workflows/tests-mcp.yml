# The MCP server, in its own pixi environment.
# Pull requests run it when the package or something it depends on changes;
# every push to main and a manual run (Actions tab) run it unconditionally.
name: "Tests: mcp"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "libs/mcp-server/**"
      - "libs/visualization/**"
      - "tests/mcp/**"
      - "tests/configs/**"
      - "configs/**"
      - "scripts/start_mcp"
      - "scripts/run_forward.py"
      - "scripts/utils/**"
      - "src/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "tests/conftest.py"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-mcp.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/mcp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          environment: mcp
      - name: Run tests
        run: pixi run --locked -e mcp python -m pytest tests/mcp --durations=10
