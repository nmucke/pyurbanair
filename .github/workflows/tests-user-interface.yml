# The browser app (libs/user-interface), in the ui pixi environment. Its
# tests fake every Tools action except config composition: no network, no solver,
# so the checkout skips the solver submodules.
# Pull requests run it when the package or something it depends on changes;
# every push to main or dev and a manual run (Actions tab) run it unconditionally.
name: "Tests: user-interface"

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "libs/user-interface/**"
      - "libs/mcp-server/**"
      - "libs/visualization/**"
      - "tests/user_interface/**"
      - "configs/**"
      - "src/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "tests/conftest.py"
      - ".github/actions/setup/**"
      - ".github/workflows/tests-user-interface.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/user_interface (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          environment: ui
      - name: Run tests
        run: pixi run --locked -e ui python -m pytest tests/user_interface --durations=10
