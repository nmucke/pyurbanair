name: Set up pixi environment
description: >
  Install (or restore from cache) one pixi environment and cap the thread and
  MPI settings for the small test workloads. Run after actions/checkout.

inputs:
  environment:
    description: Pixi environment to install (dev or mcp).
    default: dev

runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        run-install: false

    - name: Cache pixi environment
      uses: actions/cache@v4
      with:
        path: .pixi/envs
        key: pixi-${{ inputs.environment }}-${{ runner.os }}-${{ hashFiles('pixi.lock', 'pyproject.toml', 'libs/**/pyproject.toml') }}

    - name: Install ${{ inputs.environment }} environment
      shell: bash
      run: |
        if [ "${{ inputs.environment }}" = dev ]; then
          pixi run setup-dev  # works around a known bin/test clobber
        else
          pixi install --locked -e "${{ inputs.environment }}"
        fi

    - name: Limit threads; use Open MPI's ob1 transport (no UCX probing)
      shell: bash
      run: |
        {
          echo "OMP_NUM_THREADS=1"
          echo "OPENBLAS_NUM_THREADS=1"
          echo "MKL_NUM_THREADS=1"
          echo "OMPI_MCA_pml=ob1"
          echo "OMPI_MCA_btl=self,sm,tcp"
        } >> "$GITHUB_ENV"
