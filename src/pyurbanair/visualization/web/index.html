<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban wind · Forward simulation</title>
<link rel="stylesheet" href="viewer.css">
<script src="probe_charts.js" defer></script>
<script src="viewer.js" defer></script>
</head>
<body>
<main>
<header><div><p class="eyebrow">URBAN AIRFLOW</p><h1 id="title">The shape of urban wind</h1></div><a href="provenance.json">Run provenance</a></header>
<div class="controls"><label>View <select id="view" aria-label="Simulation view" disabled></select></label><p id="selection"></p><a id="download" download hidden>Download image</a></div>
<p id="status" role="status">Loading visualization…</p>
<section class="cinema" aria-label="Simulation playback"><div class="film-stage"><div class="visual"><video id="video" controls preload="metadata" hidden></video><img id="poster" alt="Simulation field preview" hidden></div><aside id="probes" aria-label="Virtual probe charts"></aside></div>
<div id="playback" class="film-controls" hidden><button id="play" type="button">Play</button><button id="restart" type="button">Restart</button><input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Seek video"><span id="clock">0:00 / 0:00</span><label>Speed <select id="rate"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="fullscreen" type="button">Fullscreen</button></div>
</section>
<div class="detail"><div><strong id="physical">Simulation time</strong><p id="caption"></p></div><div><a href="probes.csv" download>Download probe CSV</a><p>Virtual probes sample saved simulation values. Missing or solid samples remain gaps.</p></div></div>
<p id="processing" class="caption"></p><ul id="warnings" class="caption"></ul>
<noscript>JavaScript is required for synchronized playback. Download the manifest and media from this bundle using a local static server.</noscript>
</main>
</body>
</html>
