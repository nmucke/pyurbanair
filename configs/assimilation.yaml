# Data assimilation: the single config for all three DA scripts
# (scripts/run_smoother.py, scripts/run_filtering.py, scripts/run_hybrid.py).
# Each script reads the blocks it needs: smoothing -> `smoothing`;
# filtering -> `filtering`; hybrid -> `smoothing`, `filtering` and `hybrid`.
defaults:
  - common
  - case: xie_and_castro
  - model@truth_model: pyudales
  - model@assim_model: pyudales
  # Static truth + static prior + static smoother is valid for all three
  # scripts. For time-varying parameters use params@truth_params=dynamic_sine
  # params@prior_params=dynamic 'smoothing.smoother=${smoother.dynamic}'
  # (smoothing and hybrid only; filtering requires a static prior).
  - params@truth_params: dynamic_sine
  - params@prior_params: dynamic
  - assimilation_settings/smoother
  - assimilation_settings/analysis
  - assimilation_settings/localization
  - assimilation_settings/state_reduction
  - assimilation_settings/inflation
  - _self_

paths:
  # The script appends its workflow name (smoothing / filtering / hybrid).
  results_dir: ${paths.results_root}/${truth_model.name}_to_${assim_model.name}

assimilation:
  # One window = `time.simulation_time` seconds (set by the case).
  num_windows: 2
  seed: 42
  # Which prior parameters receive DA updates.
  #   * list  -> only the named parameters
  #   * null  -> every parameter the prior sampler defines
  #   * []    -> none
  # All configured prior and truth parameters are sampled and passed to their
  # forward models; unselected ones keep their sampled values. To use a model
  # default, omit the parameter from its sampler; to prescribe a value, use a
  # Constant distribution.
  params_to_estimate:
    - inflow_angle
    - velocity_magnitude
    # - sgs_bias_b0
    # - sgs_bias_b1
    # - sgs_bias_b2
  # Truth source: null -> simulate inline; a path -> load a state.nc/params.nc
  # artifact written by run_forward_model.py.
  truth_dir: null
  # Start the horizon partway into a disk-loaded truth (skips a spin-up): keep
  # frames from this time onward and rebase it to t=0. null/0 -> first frame.
  truth_start_time: null
  # Write ensemble forecasts to disk (one NetCDF per member) instead of holding
  # one in-memory ensemble Dataset.
  ensemble_save_on_disk: false
  # --- smoothing only ---
  # Persist the per-window PRIOR state ensemble (windows/window_*_prior_state.nc).
  # The posterior state and both parameter ensembles are always saved; this is
  # the large artifact, so it is off by default.
  save_prior_state: false
  # --- filtering only ---
  # Assimilate every n-th observation frame. Must divide
  # `time.simulation_time / time.output_frequency`.
  assimilate_every_n_step: 1
  # Save the per-cycle analyzed params/state histories (analysis frames only).
  save_history: true
  # Also save forecast frames at the full output cadence
  # (windows/window_{w}_forecast_state.nc); the hybrid's filter too.
  # Large; off by default.
  save_forecast_history: false

observation:
  # Temporal point sensors; coordinates come from the case (`obs.*`). The runner
  # injects the model role's solver_name.
  operator:
    _target_: data_assimilation.observation_operator.TemporalObservationOperator
    observation_operator:
      _target_: data_assimilation.observation_operator.ObservationOperator
      _convert_: all
      obs_x: ${obs.x_points}
      obs_y: ${obs.y_points}
      obs_z: ${obs.z_points}
      obs_states: ${obs.states}
  # Bin frames into `interval_seconds`-wide intervals and reduce each by `mode`
  # (mean|median|max|min). null `interval_seconds` -> every frame; set the whole
  # block to null to switch aggregation off.
  aggregation:
    _target_: data_assimilation.observation_operator.AggregateObservations
    interval_seconds: 20.0
    mode: mean

  # Physical observation uncertainty. A std is a scalar or a mapping with
  # `default` and optional `height_bands`, `components`, `sensors` overrides.
  error:
    _target_: data_assimilation.observation_error.ObservationErrorSpec
    _convert_: all
    instrument_std: 0.25
    representation_std: 0.1
    # How the error std carries over to aggregated observations:
    # propagate_mean reduces it with the mean-bin weights; none keeps the
    # configured std. This does not switch aggregation itself on or off.
    propagation: propagate_mean

# Smoothing (ESMDA): the smoother and its components. Read by smoothing.yaml
# and hybrid.yaml. Instantiate `smoothing.smoother`.
smoothing:
  smoother: ${smoother.dynamic}
  localization: ${localization.correlation}
  state_reduction: ${state_reduction.none}
  num_steps: 1
  alpha: ${.num_steps}
  # Optional post-loop Kalman smoothing of the full window trajectory reusing the
  # final posterior forecast (no extra forward solve, parameters frozen).
  # Requires state_reduction; state-bearing smoothers only.
  final_time_smoothing: false

# Filtering: the EnsembleKalmanFilter constructor arguments. Read by
# filtering.yaml and hybrid.yaml. Instantiate `filtering` (the runner adds the
# observation operator, forward model and C_D).
filtering:
  _target_: data_assimilation.filtering.EnsembleKalmanFilter
  _convert_: all
  mode: state
  analysis: ${analysis.stochastic}
  localization: ${localization.none}
  state_reduction: ${state_reduction.none}
  inflation: ${inflation.rtps}
  parameter_evolution: null
    # _target_: data_assimilation.filtering.parameter_evolution.RandomWalkEvolution
    # std: 0.5
  # Likelihood tempering: every analysis uses `beta * R`. Finite, >= 1.
  beta: 1.0

# Hybrid only (filter smoothing). The tempering is `filtering.beta`.
hybrid:
  # filter_only | shared_budget.
  #   filter_only   - ESMDA keeps its full schedule; only the filter is tempered.
  #   shared_budget - ESMDA runs alpha / w with w = (beta - 1)/beta, so the two
  #                   phases split each observation's unit budget. Needs
  #                   filtering.beta > 1, no aggregation and assimilate_every_n_step=1.
  likelihood_allocation: filter_only
