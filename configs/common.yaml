# Shared by forward.yaml and assimilation.yaml: output and scratch locations,
# ensemble budget and Hydra's run dir.

# Output and scratch locations. Each entry point adds `paths.results_dir`
# under `results_root`.
paths:
  # Which entry of `scratch` the solvers use: local | snellius | delftblue.
  # The job scripts set both through the environment (job_scripts/*/env.sh).
  machine: ${oc.env:PYURBANAIR_MACHINE,local}
  results_root: ${oc.env:PYURBANAIR_RESULTS_ROOT,.temp}
  # Absolute scratch dir the solvers chdir into, per machine. The cluster
  # entries get one dir per SLURM job (`local` outside a job).
  scratch:
    local: ${oc.env:PWD}/.temp
    snellius: /scratch-shared/${oc.env:USER}/urbanair_temp/${oc.env:SLURM_JOB_ID,local}
    delftblue: /scratch/${oc.env:USER}/urbanair_temp/${oc.env:SLURM_JOB_ID,local}
  experiment_dir: ${paths.scratch.${paths.machine}}
  # Neural surrogates: trained weights and generated training data.
  weights_dir: model_weights
  training_data_dir: training_data

# Ensemble budget. Override per run on the CLI, e.g.
# `ensemble.ensemble_size=128 ensemble.num_parallel_processes=8`.
ensemble:
  ensemble_size: 32
  num_parallel_processes: 8
  num_cpus_per_process: 1
  failure:
    # raise: a failed member aborts the run (required by the SGS-discrepancy
    # hybrid). resample_from_successes: replace it with a jittered copy of a
    # successful member.
    # policy: resample_from_successes
    policy: raise
    jitter_scale: 0.05
    seed: 0

hydra:
  run:
    dir: ${paths.results_dir}/hydra/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Flow setup shared by the LES backends, so that a uDALES and a PALM run of the
# same case simulate the same flow: configs/model/pyudales.yaml and pypalm.yaml
# read every key below, pylbm.yaml all but `nudging` and `roughness_length`. Override here (or
# with `flow.*` on the CLI) to change both at once. The parity audit behind
# these values is in docs/pypalm.md §8 "Cross-model parity with pyudales".
# Cases override what depends on the geometry (xie_and_castro: the outflow
# buffer; xie_and_castro_periodic: periodic, no inlet turbulence).
flow:
  # inflow_outflow (inflow face at xmin, outflow at xmax, cyclic in y) or
  # periodic (cyclic in x and y, driven by nudging).
  boundary_condition: inflow_outflow
  # inflow_outflow only: metres of flat ground added downstream of
  # domain.bounds (whole cells; ncpu must divide the extended nx). The outflow,
  # and PALM's outflow damping layer, then sit outside the bounds, and the
  # state is cropped back to them. null: the outflow is at xmax.
  outflow_buffer: null
  # Mean inflow profile and nudging target: U(z) = velocity_magnitude *
  # (z/z_ref)^alpha. z_ref is pinned, so velocity_magnitude means the same wind
  # whatever the domain height (unset it defaults to the domain top).
  profile:
    type: power_law
    alpha: 0.25
    z_ref: 64.0
  # Periodic runs: relaxation timescale (s) of the slab-mean u, v toward the
  # profile, and the height (m) below which nothing is nudged. 16 m keeps the
  # Xie & Castro canopy (cubes up to 17.2 m) driven by the shear layer.
  nudging:
    tnudge: 15.0
    nnudge_meters: 16.0
  # inflow_outflow: synthetic turbulent inflow from the shared digital filter
  # (src/pyurbanair/utils/digital_filter.py), identical planes in both backends
  # for the same seed. sigma_u = intensity * |U(z)|, v' and w' 0.7x. The
  # length scales are integral scales in m (x via Taylor's hypothesis);
  # time_step (s) must divide the window. seed: null derives one per member
  # from its name ("999" for a uDALES run, "urban_run" for PALM, "000", ... for
  # ensemble members), so set it to share one realisation between a uDALES and
  # a PALM run. false: the laminar mean profile.
  # Momentum roughness length z0 (m) of every wall: uDALES writes it into
  # factypes.inp for every facet type in use, PALM into `roughness_length`.
  # A `roughness_length` in the params sampler overrides it, so ESMDA can
  # estimate it. 0.05 is the value both cases ship (barcelona's PALM _p3d has
  # 0.1, now overridden). null leaves the case files alone. Limits and the
  # PALM sgs_constant conflict: docs/pyudales.md, docs/pypalm.md "Roughness".
  roughness_length: 0.05
  inlet_turbulence:
    enabled: true
    intensity: 0.15
    length_scale_x: 24.0
    length_scale_y: 12.0
    length_scale_z: 12.0
    time_step: 0.5
    seed: null
