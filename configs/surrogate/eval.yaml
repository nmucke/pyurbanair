# @package _global_
# Evaluation of trained neural surrogates. One block per evaluation script:
#   stepper           scripts/surrogate/evaluate_stepper.py
#   autoencoder       scripts/surrogate/evaluate_autoencoder.py
#   latent_generator  scripts/surrogate/evaluate_latent_generator.py
defaults:
  - /common
  - _self_

paths:
  results_dir: ${paths.weights_dir}

# Shared by every evaluation.
device: cuda
split: test
seed: 0
# Training-data root to evaluate on; null -> each model's own training data.
data_dir: null

# Inference-time uDALES inlet turbulence added to every frame `stepper`
# predicts (neural_surrogates.inlet_turbulence.InletTurbulence); needs a corpus
# generated with it.
inlet_turbulence:
  enabled: false
  seed: null   # null: the truth run's own realization; int: a fresh one per trajectory
  # output: added to every predicted frame (stored and fed back);
  # input: added only to the frame fed back, u_t = F(u_{t-1} + forcing).
  apply: output
# Inference-time y-periodicity of the `stepper` models (uDALES domains are
# periodic in y): circular y padding in every conv and y-periodic SDF features
# (neural_surrogates.periodic.make_periodic_y); no retraining.
periodic_y: false

stepper:
  # One model, or several compared side by side on the same trajectories.
  models:
    - ${paths.weights_dir}/p3d_idealized
  output_dir: ${paths.weights_dir}/stepper_eval
  sample_indices: [0]
  # Rollout length in frames; null -> the whole trajectory.
  max_steps: null
  animate: true

autoencoder:
  model_dir: ${paths.weights_dir}/tadpole_ae_s
  output_dir: ${.model_dir}/eval
  # mode: the latent mean; sample: a draw from the latent distribution.
  latent_type: mode
  # Reconstruction figures (one snapshot each) and their heights.
  num_figures: 3
  num_heights: 5
  # Snapshots the metrics are computed on.
  num_metric_samples: 48
  batch_size: 8
  # Cap on the crops the encoder/decoder run at once (null: the model's own),
  # to fit large grids in GPU memory.
  max_internal_batchsize: null

latent_generator:
  model_dir: ${paths.weights_dir}/latent_generator_s
  output_dir: ${.model_dir}/eval
  # Held-out snapshots compared against, spread over the trajectories. The real
  # pairwise spread (so diversity_ratio) and the Reynolds stresses need several
  # snapshots per grid: with one per grid (e.g. 8 over 7 test grids) they are NaN.
  max_snapshots: 64
  num_noise_seeds: 4
  batch_size: 4
  # Cap on the crops the frozen AE encodes/decodes at once (null: the model's
  # own), to fit large grids in GPU memory; the global decode is the largest.
  max_internal_batchsize: null
  # ODE sampler of the main samples: euler (NFE = steps) | heun (NFE = 2 x steps).
  sampler: euler
  # Sampling steps tried in the step sweep, once per entry of `samplers`
  # (e.g. [euler, heun]; null -> `sampler` only).
  num_steps_sweep: [5, 25, 50, 100]
  samplers: [euler, heun]
  # Decoder spatial policies to compare on the same latents, e.g.
  # [local, halo, global]; each one differing from the AE's trained policy adds
  # generated_decode_<mode> and ae_recon_decode_<mode>. null -> none.
  decode_modes: [local, halo, global]
  # Halo of a halo decode (a multiple of 16); null -> the AE's halo_size.
  decode_halo_size: null
  # Figures of real vs generated fields.
  num_figures: 2
  # Velocity values pooled for the histograms, and their bins.
  max_values: 200000
  n_bins: 64
  # Resamples for the held-out variability the thresholds are relative to.
  bootstrap_resamples: 200
  # Roll a trained stepper out from the generated fields; null -> skip.
  rollout_stepper_dir: null
  rollout_steps: 20
  # Pass/fail thresholds, relative to the autoencoder and the data's own variability.
  acceptance:
    profile_rmse_factor: 2.0
    w1_factor: 2.0
    divergence_factor: 3.0
    diversity_min_ratio: 0.25
