# @package _global_
# Train SSRollingUrbanNet (Park & Lee 2026) with Roll-3 from scratch (an ablation
# arm; the paper fine-tunes Roll-1 instead, finetune_roll3.yaml):
#   python scripts/surrogate/train.py --config-name surrogate/baselines/ssrolling/train_roll3
# Data, dataloader and paths come from surrogate/training.yaml, as for our steppers.
# Arms: give each its own `name`, or it resumes and overwrites this run (the
# output folder is weights_dir/<name> and training.yaml sets `resume: true`):
#   3DSwinUrbanNet: 'architecture=${baseline_architectures.urbanaurora_512}' name=urbanaurora_roll3
#   MSE only:       trainer.alpha=0 name=ssrolling_roll3_mse
# `architecture` is an interpolation, so change its keys at the source,
# baseline_architectures.<name>.<key>=..., e.g. SSGen's `n_levels`, which must
# equal the corpus' nz: baseline_architectures.ssrolling_512.n_levels=16
defaults:
  - /surrogate/training
  - /surrogate/baselines/architectures@baseline_architectures
  - _self_

task: stepper
name: ssrolling_roll3
architecture: ${baseline_architectures.ssrolling_512}
init_weights: null
trainer:
  _target_: neural_surrogate_baselines.RolloutTrainer
  # Constant learning rate, no clipping, until 50 epochs without improvement.
  num_epochs: 1000
  patience: 50
  lr_warmup_epochs: null
  grad_clip_norm: null
  pushforward_epochs_per_step: null
  # Weight of the spectral loss.
  alpha: 1.0
  # Recompute the Swin blocks and Aurora's Perceiver encoder/decoder in
  # backward: Roll-3 at batch 2 on the 2.8 Mcell grids then peaks at ~31 GB
  # instead of not fitting an H100 94 GB (same gradient, ~12 % slower).
  activation_checkpoint_modules:
    - aurora.backbone.encoder_layers.*.blocks.*
    - aurora.backbone.decoder_layers.*.blocks.*
    - aurora.encoder
    - aurora.decoder
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-5
  weight_decay: 0.0
batch_sampler:
  batch_size: 2
  # Above 2 x the largest realistic grid (2.8 Mcell), so every batch is the
  # paper's 2 (training.yaml's 4.19 M would halve the batches of 51 of the
  # 500 realistic trajectories).
  cell_budget: 6000000
dataloader:
  # Whole-frame reads mostly wait on the file system: more workers overlap it
  # (15 + the main process on the 16 cores of a Snellius H100 share).
  num_workers: 15
  collate_fn:
    _target_: neural_surrogates.datasets.transition.transition_collate
    _partial_: true
dataset:
  _target_: neural_surrogate_baselines.RolloutTransitionDataset
  param_vars: null
  # Two input steps; the loss covers every one of the `pushforward_steps`.
  num_history_steps: 2
  pushforward_steps: 3
