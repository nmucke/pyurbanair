# @package _global_
# Fine-tune the Roll-1 SSRollingUrbanNet with Roll-3 on the same data, the
# paper's transfer-learning step (TL Roll-3):
#   python scripts/surrogate/train.py --config-name surrogate/baselines/ssrolling/finetune_roll3
# The architecture, inputs and normalisation come from the pretrained model.
defaults:
  - /surrogate/training
  - _self_

task: finetune_stepper
name: ssrolling_tl_roll3
# A train_roll1.yaml output folder (weights + config).
pretrained_dir: ${paths.weights_dir}/ssrolling_roll1
# Every weight is trained, starting from the Roll-1 ones.
method: full
recompute_normalization: false
trainer:
  _target_: neural_surrogate_baselines.RolloutTrainer
  num_epochs: 200
  patience: 50
  lr_warmup_epochs: null
  grad_clip_norm: null
  pushforward_epochs_per_step: null
  alpha: 1.0
  # Recompute the Swin blocks and Aurora's Perceiver encoder/decoder in
  # backward: Roll-3 at batch 2 on the 2.8 Mcell grids then peaks at ~31 GB
  # instead of not fitting an H100 94 GB (same gradient, ~12 % slower).
  activation_checkpoint_modules:
    - aurora.backbone.encoder_layers.*.blocks.*
    - aurora.backbone.decoder_layers.*.blocks.*
    - aurora.encoder
    - aurora.decoder
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-5
  weight_decay: 0.0
batch_sampler:
  batch_size: 2
  # Above 2 x the largest realistic grid (2.8 Mcell), so every batch is the
  # paper's 2 (training.yaml's 4.19 M would halve the batches of 51 of the
  # 500 realistic trajectories).
  cell_budget: 6000000
dataloader:
  # Whole-frame reads mostly wait on the file system: more workers overlap it
  # (15 + the main process on the 16 cores of a Snellius H100 share).
  num_workers: 15
  collate_fn:
    _target_: neural_surrogates.datasets.transition.transition_collate
    _partial_: true
dataset:
  _target_: neural_surrogate_baselines.RolloutTransitionDataset
  param_vars: null
  # null: take these from the pretrained model.
  num_history_steps: null
  pushforward_steps: 3
