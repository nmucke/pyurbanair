# @package _global_
# Train SSRollingUrbanNet (Park & Lee 2026) with the paper's Roll-1 recipe:
#   python scripts/surrogate/train.py --config-name surrogate/baselines/ssrolling/train_roll1
# then fine-tune it with Roll-3 (finetune_roll3.yaml). Data, dataloader and
# paths come from surrogate/training.yaml, as for our steppers.
# Arms: give each its own `name`, or it resumes and overwrites this run (the
# output folder is weights_dir/<name> and training.yaml sets `resume: true`):
#   3DSwinUrbanNet: 'architecture=${baseline_architectures.urbanaurora_512}' name=urbanaurora_roll1
#   MSE only:       trainer.alpha=0 name=ssrolling_roll1_mse
# `architecture` is an interpolation, so change its keys at the source,
# baseline_architectures.<name>.<key>=..., e.g. SSGen's `n_levels`, which must
# equal the corpus' nz (16 by default; pyudales_xie_and_castro has 24):
# baseline_architectures.ssrolling_512.n_levels=24
defaults:
  - /surrogate/training
  - /surrogate/baselines/architectures@baseline_architectures
  - _self_

task: stepper
name: ssrolling_roll1
architecture: ${baseline_architectures.ssrolling_512}
init_weights: null
trainer:
  _target_: neural_surrogate_baselines.RolloutTrainer
  # Constant learning rate, no clipping, until 50 epochs without improvement.
  num_epochs: 1000
  patience: 50
  lr_warmup_epochs: null
  grad_clip_norm: null
  pushforward_epochs_per_step: null
  # Weight of the spectral loss.
  alpha: 1.0
  # Batches per training / validation epoch; null: the whole split. A full
  # pyudales_idealized epoch is ~25k batches, so cap it to validate (and count
  # patience) more often than every few hours.
  epoch_batches: null
  val_batches: null
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0e-5
  weight_decay: 0.0
batch_sampler:
  batch_size: 2
  # Above 2 x the largest realistic grid (2.8 Mcell), so every batch is the
  # paper's 2 (training.yaml's 4.19 M would halve the batches of 51 of the
  # 500 realistic trajectories).
  cell_budget: 6000000
dataloader:
  # Whole-frame reads mostly wait on the file system: more workers overlap it
  # (15 + the main process on the 16 cores of a Snellius H100 share).
  num_workers: 15
  collate_fn:
    _target_: neural_surrogates.datasets.transition.transition_collate
    _partial_: true
dataset:
  _target_: neural_surrogate_baselines.RolloutTransitionDataset
  param_vars: null
  # Two input steps; the loss covers every one of the `pushforward_steps`.
  num_history_steps: 2
  pushforward_steps: 1
