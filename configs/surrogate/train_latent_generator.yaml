# @package _global_
# Train the flow-matching generator of initial fields in the autoencoder's latent space.
# Shared training defaults: training.yaml. The `trainer`, `optimizer`,
# `batch_sampler`, `dataloader` and `dataset` blocks below override them key by key.
# The velocity net: latent_generator_architecture=<name>, one of compact_h512,
# compact_wide_head, compact_bottleneck, channel_skip_h176, full_width. Each sets
# its own default `name`, so a switch never resumes another net's checkpoint.
defaults:
  - training
  - _self_
  - /latent_generator_architecture: compact_h512

# Which model scripts/surrogate/train.py builds.
task: latent_generator
autoencoder_dir: ${paths.weights_dir}/tadpole_ae_s
architecture:
  _target_: neural_surrogates.TadpoleLatentGenerator
  param_history_steps: 12
  # hidden_size, n_layers, the skips and velocity_conditioning come from
  # configs/latent_generator_architecture/. velocity_conditioning is how params
  # + flow time reach the net: input_film (one FiLM on the input tokens), adaln
  # (adaLN-Zero in every block) or adaln_bottleneck (design B, a D-wide stream).
  num_heads: 8
  time_embed_dim: 64
  film_hidden: 256  # width of the conditioning embedding every adaLN block reads
  mlp_ratio: 4
  use_checkpoint: false
  # Optional, absent = off (docs/neural_surrogates.md, "Compact velocity nets";
  # gaussian_skip, head_hidden, head_layers, mlp_hidden: see the group files):
  # gaussian_eig_floor: 1.0e-4  # floor of the Sigma eigenvalues (gaussian_skip)
  # prediction: data            # net predicts the clean sample (absent: velocity)
  # time_shift: 3.0             # SD3 shift of the flow-time grid (absent: 1)
  normalize: true
  num_sampling_steps: 50
  latent_eps: 1.0e-6
  max_latent_tokens: 4096
# Optional cache of the frozen encoder's latents: one GPU pass over the data
# (resumable), after which training reads latents instead of states, skips the
# encoder, and takes the latent statistics over every train frame. null:
# encode every batch. Keyed on the autoencoder (weights, settings) and the
# data: a changed one needs a new dir.
latent_cache:
  output_root: null
  prepare_only: false   # encode, then exit (a GPU job before training)
# Batches used to estimate the latent normalization statistics (no cache).
latent_stats:
  max_batches: 50
  seed: 0
# Stored with the weights so a consumer knows what the model was trained on.
physical_metadata:
  units: {u: m/s, v: m/s, w: m/s, inflow_angle: deg, velocity_magnitude: m/s}
  coordinate_order: [z, y, x]
  geometry_mask_convention: "blanking: 1 = obstacle; model fluid mask = 1 - blanking"
  notes: ""
trainer:
  _target_: neural_surrogates.LatentFlowMatchingTrainer
  # Floor of the cosine schedule: the loss still improves at the end of a run.
  lr_min: 1.0e-5
  compile_dynamic: null
  val_seed: 0
optimizer:
  weight_decay: 1.0e-2
batch_sampler:
  # Batches mix frames of every trajectory on one grid shape (different
  # geometries) for more diverse steps; max_latent_tokens still bounds them.
  batch_size: 16
  cell_budget: 393216
  group_by: grid
dataloader:
  num_workers: 8
  collate_fn:
    _target_: neural_surrogates.snapshot_history_collate
    _partial_: true
dataset:
  _target_: neural_surrogates.SnapshotHistoryDataset
  param_vars: [inflow_angle, velocity_magnitude]
  param_history_steps: ${architecture.param_history_steps}
  time_stride: 1
  random_crop_size: null
  sdf_features: null
  sdf_clamp_cells: null
  # Repeat the first parameters back in time when the history is too short.
  constant_prehistory: true
  cadence_rtol: 0.1
