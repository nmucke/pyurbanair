# @package _global_
# Training defaults shared by every neural-surrogate training config
# in this folder (train_stepper, train_autoencoder, train_latent_generator,
# train_dft, finetune_stepper, finetune_dft).
# Not an entry point: each of those lists it first and overrides what differs.
defaults:
  - /common
  - architectures
  - _self_

paths:
  results_dir: ${paths.weights_dir}
  data_dir: ${paths.training_data_dir}/pyudales_idealized

trainer:
  device: cuda
  num_epochs: 200
  patience: 20
  resume: true
  checkpoint_every: 5
  # Speed
  amp: true
  amp_dtype: bfloat16
  compile_model: false
  # Glob paths of submodules to torch.compile in place (dynamic shapes); null: off.
  compile_modules: null
  # Glob paths of submodules to activation-checkpoint (recompute in backward); null: off.
  activation_checkpoint_modules: null
  # Changes the gradient (off): glob paths of submodules run under no_grad in every
  # gradient-carrying rollout step but the last; null: off.
  unroll_no_grad_modules: null
  channels_last: false
  cudnn_benchmark: true
  tf32: true
  # Learning-rate schedule and stability: a linear warmup from lr_warmup_start
  # to the optimizer's lr over lr_warmup_epochs, then a cosine to lr_min. The
  # warmup steps once per epoch, or after every optimizer step with
  # lr_warmup_per_step (peak lr is then reached at epoch lr_warmup_epochs).
  lr_warmup_epochs: 5
  lr_warmup_start: 1.0e-6
  lr_min: 1.0e-6
  lr_warmup_per_step: false
  grad_clip_norm: 1.0
  # Batches whose gradients are summed into one optimizer step (an effective
  # batch of batch_size x grad_accum_steps when a larger batch does not fit).
  grad_accum_steps: 1
  # Or step every >= N samples on their per-sample mean (fixed effective batch
  # under cell_budget's variable batches); null: off. Not with grad_accum_steps > 1.
  grad_accum_samples: null
  # [start, count]: torch.profiler table of these epoch-0 micro-batches -> profile.txt.
  profile_steps: null
  # Ignore solid (building) cells in the loss.
  mask_loss: true

# Training loss; a training config replaces it if its model needs another.
loss:
  _target_: torch.nn.MSELoss

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-6

# Batching. The sampler groups every batch by trajectory (needed for
# multi-geometry data, whose grids cannot be stacked) and caps it at
# `cell_budget` grid cells, so batches of large domains shrink below
# `batch_size`.
batch_sampler:
  _target_: neural_surrogates.TrajectoryBatchSampler
  batch_size: 4
  cell_budget: 4194304
  shuffle: true
  drop_last: true
  seed: 0
  # trajectory: one trajectory per batch. grid: frames of any trajectories on
  # one grid shape (per-sample geometry; snapshot and latent-cache data only).
  group_by: trajectory

# batch_size / shuffle / drop_last come from the sampler.
dataloader:
  _target_: torch.utils.data.DataLoader
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  # How samples are stacked into a batch; set by each training config.
  collate_fn: null

dataset:
  root_dir: ${paths.data_dir}
  state_vars: [u, v, w]
  # Geometry input: signed distance to the buildings and/or its gradient.
  sdf_features: both  # none | sdf | grad | both
  sdf_clamp_cells: 32
  cache: false
  dtype: float32

# Optional lossless re-chunked copy of the training states (storage only:
# every split, frame and value kept), made or validated before training;
# params are still read from dataset.root_dir. null: read dataset.root_dir
# as is. Whole frames (spatial_chunks: null) suit models that read whole
# domains; one copy serves every such model on that data (DFT, steppers,
# baselines). train_autoencoder overrides it with crop-sized tiles.
prechunk:
  output_root: null
  prepare_only: false   # prepare, then exit (a CPU job before the GPU run)
  spatial_chunks: null  # whole frames
