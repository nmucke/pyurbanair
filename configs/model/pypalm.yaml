name: pypalm
solver_name: palm
compile: false

forward_model:
  _target_: pypalm.forward_model.ForwardModel
  _convert_: all
  # Case folder (_p3d) + STL geometry follow the selected `case`.
  case_dir: ${geometry.case_dir}
  stl_path: ${geometry.stl_path}
  # Base scratch dir shared across models; pypalm nests <temp_dir>/experiment/urban_run.
  temp_dir: ${paths.experiment_dir}
  experiment_name: urban_run
  # PALM uses a slab decomposition (npex=ncpu, npey=1), derived automatically in
  # ForwardModel._apply_processor_topology. The inflow/outflow multigrid solver
  # needs uniform subdomains, so ncpu must divide nx (=domain.nx grid points).
  # For barcelona nx=225 the valid choices are {1,3,5,9,15,25,45,75,225};
  # 15 is the largest that fits a 16-core box.
  ncpu: 1
  save_only_last_timestep: false
  verbose: false
  boundary_condition: periodic # inflow_outflow #
  # inflow_outflow only: PALM's outflow damping layer relaxes u/v/w toward the
  # initial profile over the last `width` m before the radiation outflow, at up
  # to `factor` 1/s. Without it the reversed flow behind the last obstacle meets
  # the outflow and the non-dissipative pw-scheme diverges within ~10 s
  # (xie_and_castro); factor 0.1 is not enough. Cyclic runs never get these keys
  # (PALM rejects them, PAC0352). null -> write nothing. See docs/pypalm.md §8.
  outflow_damping:
    factor: 1.0            # 1/s; outflow_damping_factor
    width: 4.0             # m from the outflow edge; outflow_damping_width
  # Per-backend SGS knob. This is the DEFAULT: a `sgs_constant` in the params
  # sampler (configs/params/*.yaml) overrides it, so ESMDA can still estimate it.
  #
  # Deliberately null for PALM. PALM has no Smagorinsky-style multiplier (c_0 is
  # hardcoded), so `sgs_constant` maps to `km_constant` — a CONSTANT EDDY
  # DIFFUSIVITY in m^2/s, not a dimensionless constant like uDALES/pylbm take.
  # Setting it is a regime switch: it replaces PALM's prognostic SGS-TKE closure
  # with constant-Km and forces constant_flux_layer=.false. (PAC0149), disabling
  # the wall model. The dimensionless ~0.24 used by the other backends is far too
  # little dissipation as m^2/s and diverges. null keeps PALM's own closure.
  # Only set this to a PALM-appropriate m^2/s value chosen for PALM.
  sgs_constant: null
  # Periodic runs are driven by PALM's nudging scheme (NUDGING_DATA + an inert
  # LSF_DATA), relaxing the domain toward the inflow_angle/velocity_magnitude
  # wind — the counterpart of pyudales's periodic nudging path. See
  # docs/pypalm.md §"Nudging driver for periodic runs".
  nudging_config:
    enabled: true          # false -> today's un-driven periodic staging
    tnudge: 15.0           # s; relaxation timescale, matches pyudales
    nnudge_meters: 4.0     # no nudging below this height (via huge tnudge)
    profile_config:
      type: power_law
      alpha: 0.25
  # Switchable inlet turbulence (inflow_outflow only; staging raises under
  # periodic). Two methods, see docs/pypalm.md §8:
  #   digital_filter       turbulent inflow planes (mean profile + Xie & Castro
  #                        digital-filter fluctuations, the generator uDALES'
  #                        inlet uses) imposed on the inflow face through
  #                        PALM's turbulent_inflow 'read_from_file' reader.
  #                        Prescribed intensity and length scales, per-member
  #                        seed, works with static/time-varying params and warm
  #                        starts. Use this for cross-model comparisons.
  #   random_disturbances  PALM's own re-injected random u/v kicks
  #                        (create_disturbances + dt_disturb) in a strip that
  #                        on xie_and_castro lies inside the first building row.
  #                        Uncontrolled intensity/length scales; kept to
  #                        reproduce older runs.
  # `enabled: false` never switches PALM's turbulent_inflow module off: with
  # time-varying params it is the reader of the mean inflow planes.
  inlet_turbulence:
    enabled: false
    method: digital_filter
    # One-off random kick on u/v at cold-start init (init_3d_model.f90:1488),
    # independent of `enabled`/`method`. With false and `random_disturbances`,
    # create_disturbances stays on and disturbance_energy_limit=0.0 suppresses
    # only the kick. A warm start always suppresses it.
    initial_seed: false
    # --- digital_filter: same keys and values as pyudales.yaml's block -------
    intensity: 0.15        # u'_rms / |U_mean(z)|, constant in z; v', w' get 0.7x
    length_scale_y: 12.0   # m, spanwise integral length scale
    length_scale_z: 12.0   # m, vertical
    length_scale_x: 24.0   # m, streamwise -> AR(1) time scale via Taylor
    time_step: 0.5         # s between inflow planes; must divide the window
    seed: null             # null -> derived from the member name (+ random_seed)
    # --- random_disturbances --------------------------------------------------
    dt_disturb: 5.0        # s; interval between perturbation injections
    amplitude: 0.25        # m/s; PALM's disturbance_amplitude
    begin: null            # inflow_disturbance_begin, grid pts; null -> PALM auto (min(10, nx/2))
    end: null              # inflow_disturbance_end, grid pts; null -> PALM auto (min(100, 3nx/4))
    level_b: null          # disturbance_level_b, m; null -> PALM auto (zu(3))
    level_t: null          # disturbance_level_t, m; null -> PALM auto (zu(nzt/3))
  # Seed of PALM's random disturbances (the initial kick and the inflow
  # perturbations above): &initialization_parameters ensemble_member_nr, an int
  # in [0, 2000]. null writes nothing (PALM's default 0). One value per run:
  # ensemble members all inherit it. Also mixed into the digital_filter seed.
  # Change it for a replica of a turbulent truth.
  random_seed: null
  nx: ${domain.nx}
  ny: ${domain.ny}
  nz: ${domain.nz}
  bounds: ${domain.bounds}
  simulation_time: ${time.simulation_time}
  output_frequency: ${time.output_frequency}
  spinup_time: ${time.spinup_time}

prepare:
  _target_: pyurbanair.config.hydra_helpers.prepare_compile
  compile: ${..compile}

ensemble_model:
  _target_: pypalm.ensemble_forward_model.EnsembleForwardModel
  _convert_: all
  ensemble_size: ${ensemble.ensemble_size}
  num_parallel_processes: ${ensemble.num_parallel_processes}
  num_cpus_per_process: ${ensemble.num_cpus_per_process}
  # Resample numerically-diverged members from a successful donor instead of
  # aborting the whole run. PALM handles the divergence itself (it terminates
  # without writing a 3D output); pypalm reports the missing output as a member
  # failure so this policy can replace it.
  failure: ${ensemble.failure}
