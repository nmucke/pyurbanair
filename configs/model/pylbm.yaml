name: pylbm
solver_name: pylbm
compile: true

forward_model:
  _target_: pylbm.forward_model.ForwardModel
  _convert_: all
  # STL geometry follows the selected `case` (configs/case/<name>.yaml).
  stl_path: ${geometry.stl_path}
  # Base scratch dir shared across models; pylbm nests <temp_dir>/experiment/runcase.
  temp_dir: ${paths.experiment_dir}
  experiment_name: runcase
  # auto -> build with CUDA/NVFORTRAN where NVHPC is installed (GPU nodes) and
  # fall back to a gfortran CPU build otherwise, so this same config runs on a
  # laptop. Use `cuda: true` to *require* CUDA (a GPU batch job should fail
  # rather than silently drop to a far slower CPU build); `cuda: false` forces
  # gfortran.
  cuda: auto
  # OpenMP threads per run. >1 builds with MP=1 and runs with OMP_NUM_THREADS;
  # ignored (with a warning) by a CUDA build. In an ensemble, set
  # ensemble.num_cpus_per_process to match, and mind that the hardware is
  # DRAM-bandwidth-bound: little gain beyond the physical performance cores.
  ncpu: 1
  verbose: false
  boundary_condition: ${flow.boundary_condition}  # configs/common.yaml
  # Per-backend SGS constant -> the `ivreman smagor` infile line, where the LBM
  # forms const = 2.5*smagorinsky**2 (m_vreman.F90). This is the DEFAULT: a
  # `sgs_constant` in the params sampler (configs/params/*.yaml) overrides it, so
  # ESMDA can still estimate it. null -> leave the infile template's value.
  #
  # NOTE the three backends' sgs_constant are NOT the same physical quantity, so
  # each config carries its own value: uDALES/pylbm take a dimensionless
  # Smagorinsky-family constant, PALM takes an eddy diffusivity in m^2/s.
  # 0.15 matches the LBM's own generated infile default (m_mkinfile.F90:16).
  sgs_constant: 0.15
  profile_config:
    type: power_law
    alpha: 0.25
  # Inflow turbulence through the LBM's forcing slab 10 cells downstream of the
  # inlet (m_inflow_turbulence_*.F90). `enabled: false` leaves infile.in
  # untouched. Requires boundary_condition: inflow_outflow. Methods:
  #   random_forcing  the LBM's own pseudo-random perturbations (the `lturb`
  #                   line of infile.in); `amplitude` is a lattice velocity
  #                   increment per step: 5e-5 is ~1% TI, nearly laminar.
  #   digital_filter  the Xie & Castro digital-filter inflow uDALES and PALM
  #                   use (pyurbanair/utils/digital_filter.py), same keys and
  #                   same fluctuations for the same seed; written per window as
  #                   the forcing buffers of a restart run (docs/pylbm.md §7).
  inlet_turbulence:
    enabled: false
    method: random_forcing
    # --- random_forcing: defaults mirror the solver's infile template --------
    amplitude: 5.0e-05
    update_interval: 100  # timesteps between turbulence updates (nrturb)
    # --- digital_filter: same keys and values as pyudales.yaml's block -------
    intensity: 0.15        # u'_rms / |U_mean(z)|, constant in z; v', w' get 0.7x
    length_scale_y: 12.0   # m, spanwise integral length scale
    length_scale_z: 12.0   # m, vertical
    length_scale_x: 24.0   # m, streamwise -> AR(1) time scale via Taylor
    time_step: 0.5         # s between planes; must divide the window
    seed: null             # null -> derived from the member's experiment name
  nx: ${domain.nx}
  ny: ${domain.ny}
  nz: ${domain.nz}
  bounds: ${domain.bounds}
  simulation_time: ${time.simulation_time}
  output_frequency: ${time.output_frequency}
  spinup_time: ${time.spinup_time}

prepare:
  _target_: pyurbanair.config.hydra_helpers.prepare_compile
  compile: ${..compile}

ensemble_model:
  _target_: pylbm.ensemble_forward_model.EnsembleForwardModel
  _convert_: all
  ensemble_size: ${ensemble.ensemble_size}
  num_parallel_processes: ${ensemble.num_parallel_processes}
  num_cpus_per_process: ${ensemble.num_cpus_per_process}
  failure: ${ensemble.failure}
