_target_: pyurbanair.static_parameters.ParameterSampler
_convert_: all
seed: 42
parameters:
  inflow_angle:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.0
    std: 10.0
  velocity_magnitude:
    _target_: pyurbanair.static_parameters.Normal
    mean: 5.0
    std: 1.0
    min: 0.1
  # Model-error compensation knobs (docs/archive/esmda_model_error_parameters.md). Tight
  # priors: each extra free parameter risks an underdetermined inverse / ensemble
  # collapse with few sensors. `assimilation.params_to_estimate` selects DA
  # updates only; all entries here are sampled and applied to predictions.
  # Use Constant for prescribed values, or omit an entry to use model defaults.
  # Power-law shear exponent α: u(z) = u_ref (z/z_ref)^α.
  vertical_inflow_exponent:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.25
    std: 0.05
    min: 0.05
  # Sub-grid-scale mixing constant. Meaning is per-solver (LBM smagorinsky /
  # uDALES cs / PALM km_constant proxy), so set the range to the ASSIMILATION
  # model. Keep the prior near/above the solver's stable threshold — too little
  # SGS dissipation diverges the run (docs/archive/esmda_model_error_parameters.md §8).
  # Default range targets uDALES' Vreman c_vreman around its 0.12 default
  # (configs/model/pyudales.yaml). Below ~0.10 energy piles up at the grid scale;
  # on xie_and_castro 0.05 still runs, 0.04 can diverge at the outflow
  # (docs/pyudales.md §7).
  sgs_constant:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.12
    std: 0.02
    min: 0.07
  # Wall roughness length z0 (m), uDALES facets / PALM roughness_length. Off by
  # default: the model configs then apply flow.roughness_length (0.05).
  # Uncomment to sample (and add to assimilation.params_to_estimate to estimate)
  # it. LogNormal: log(z0) ~ Normal(log(median), log_std), so log_std 0.7 is a
  # factor ~2 per std (68% in 0.025-0.10 m); min/max clamp the draws only. The
  # DA updates log(z0), so every member gets z0 > 0; the upper bound is NOT
  # enforced after an update. PALM needs z0 < dz/2 and no sgs_constant (delete it
  # above). On the 2 m xie_and_castro grid most uDALES wall sections sit 1 m from
  # their facet, so z0 above ~0.37 m (1 m / e) leaves the log law's range there
  # (docs/pyudales.md, docs/pypalm.md "Roughness"). pylbm ignores it.
  # roughness_length:
  #   _target_: pyurbanair.static_parameters.LogNormal
  #   median: 0.05
  #   log_std: 0.7

  pressure_gradient_magnitude:
    _target_: pyurbanair.static_parameters.Constant
    value: 0.0041912


  sgs_bias_b0:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.0
    std: 0.2
    min: -1.0

  sgs_bias_b1:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.0
    std: 0.2
    min: -1.0

  sgs_bias_b2:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.0
    std: 0.2
    min: -1.0
