# @package _global_
#
# Case: Barcelona urban geometry.
#
# Select with `case=barcelona`. Bundles the domain bounds, sensor layout and STL
# geometry for the real Barcelona block into one switchable group. `size/` and
# `preset/` overlays deep-merge over the domain/obs below.

case_name: barcelona

domain:
  # Grid + physical bounds, matched to the domain-frame STL produced by
  # tools/prepare_case_stl.py (full geometry; merged buildings+ground spans
  # [0, 906.09] x [0, 874.37] x [0, 84.75] m). Grid is isotropic dx=dy=dz=2 m.
  #
  # uDALES treats `bounds` as a CROP WINDOW into the STL (the mesh is translated
  # by -bounds_lower, never scaled), so to run a smaller/cheaper region just
  # narrow `bounds` to a sub-window in these metre coordinates and lower nx/ny/nz
  # to keep the resolution, e.g. a 200 m square at the centre:
  #   domain.bounds=[[353,553],[337,537],[0,128]] domain.nx=100 domain.ny=100 domain.nz=64
  # (nfcts still counts all STL facets; regenerate the STL with --size for fewer.)
  # 4m resolution
  nx: 224
  ny: 224
  nz: 32

  # 2m resolution
  # nx: 450
  # ny: 435
  # nz: 64
  # bounds:
  #   - [0.0, 900.0]
  #   - [0.0, 870.0]
  #   - [0.0, 128.0]
  bounds:
    - [0.0, 896.0]
    - [0.0, 896.0]
    - [0.0, 128.0]

geometry:
  # One folder per case (see geometries/README.md): the STL every backend
  # reads (produced by scripts/tools/prepare_case_stl.py), the uDALES namoptions
  # (its `stl_file` names the STL next to it) and the PALM _p3d.
  case_dir: geometries/barcelona
  stl_path: ${.case_dir}/buildings.stl
  # Precomputed uDALES IBM geometry (solid_*/fluid_boundary_*/facet_sections_* +
  # geom_meta.json), generated by scripts/tools/preprocess_udales_geometry.py and
  # saved in this case folder. Reused instead of re-running the ~30+ min STL->IBM
  # Fortran classifier over the 422k-facet mesh. The bundle is grid-specific;
  # regenerate it if you change nx/ny/nz/bounds (a grid mismatch is caught via
  # geom_meta.json). Set to null to force generating from the STL.
  udales_precomputed_geom_dir: ${.case_dir}

obs:
  # Observation operator. Sensor coordinates are in the domain.bounds frame
  # (metres): x in [0, 900], y in [0, 870], z in [0, 128] (same frame as the STL,
  # which spans [0, 906.09] x [0, 874.37] x [0, 56.69]). They were placed against
  # geometries/barcelona/buildings.stl on a balanced 3x2 grid: every sensor sits at
  # street level (z=3 m) in an open street canyon between blocks, >=6 m from the
  # nearest building footprint in every direction (verified by a 3-D point-in-mesh
  # test at z=3 m), so none is inside a building or directly in front of a facade
  # (robust to the varying inflow angle).
  mode: points

  x_points: [225.0, 449.0, 675.0, 239.0, 449.0, 675.0]
  y_points: [255.0, 253.0, 253.0, 609.0, 609.0, 609.0]
  z_points: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0]

  states: [u, v, w]
  temporal_mode: full

time:
  # Per-window simulation horizon for this geometry (seconds). One assimilation
  # window is `simulation_time` long with a `spinup_time` constant-inflow plateau
  # in front; the state is written every `output_frequency` s. The number of
  # windows is a compute knob set in assimilation.yaml.
  simulation_time: 300.0
  output_frequency: 10.0
  spinup_time: 500.0
  # Time-varying parameter knot spacing: the dynamic samplers take a new value
  # every `seconds_per_knot` seconds over `simulation_time`; a non-multiple
  # window end is reached by linear extrapolation.
  seconds_per_knot: 60.0
  # simulation_time: 100.0
  # output_frequency: 10.0
  # spinup_time: 100.0
