# @package _global_
# Fixed CPU test defaults; fixture/caller supplies temporary data paths.
defaults:
- _self_
- /neural_surrogate/finetune_mode@_global_: dft
pretrained_model_dir: model_weights/tadpole_ae_s_new
model_name: dft_s
lora:
  variant: standard
  rank: 32
  alpha: 64
  dropout: 0.0
  target_preset: attention
  target_modules: null
  modules_to_save: []
recompute_normalization: false
trainer:
  _target_: neural_surrogates.Trainer
  num_epochs: 1
  device: cpu
  patience: 10
  amp: false
  amp_dtype: bfloat16
  compile_model: false
  compile_dynamic: null
  channels_last: false
  cudnn_benchmark: true
  tf32: true
  pushforward_epochs_per_step: 5
  pushforward_start_steps: 1
  lr_warmup_epochs: 3
  lr_warmup_start: 1.0e-06
  lr_min: 1.0e-06
  mask_loss: true
  grad_clip_norm: 1.0
  grad_unroll_steps: 2
  resume: true
  checkpoint_every: 5
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0005
  weight_decay: 0.0
dataset:
  _target_: neural_surrogates.TransitionDataset
  root_dir: .temp/tests/training_data
  state_vars: null
  param_vars: null
  sdf_features: null
  sdf_clamp_cells: null
  num_history_steps: null
  cache: false
  dtype: float32
  pushforward_steps: 1
batch_sampler:
  _target_: neural_surrogates.TrajectoryBatchSampler
  batch_size: 1
  cell_budget: 393216
  shuffle: true
  drop_last: true
  seed: 0
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 1
  shuffle: true
  drop_last: true
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  collate_fn:
    _target_: neural_surrogates.datasets.transition.transition_collate
    _partial_: true
