# @package _global_
# The tiny run every test shares: a 20 x 20 x 4 grid around the Xie & Castro
# block, 3 s windows written every second, and a 2-member ensemble on one
# worker. Sensors and nudging height fit this grid.
domain:
  nx: 20
  ny: 20
  nz: 4
  bounds: [[0.0, 20.0], [0.0, 20.0], [0.0, 10.0]]

time:
  simulation_time: 3.0
  output_frequency: 1.0
  spinup_time: 1.0
  seconds_per_knot: 1.5

obs:
  x_points: [2.5, 2.5, 18.0, 18.0]
  y_points: [5.0, 15.0, 5.0, 15.0]
  z_points: [3.0, 3.0, 3.0, 3.0]
  validation_x_points: [16.0]
  validation_y_points: [18.0]
  validation_z_points: [2.0]

ensemble:
  ensemble_size: 2
  num_parallel_processes: 1
