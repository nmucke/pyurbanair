# @package _global_
# A tiny SSRollingUrbanNet for one CPU epoch on the tests' tiny data
# (nz, ny, nx = 6, 20, 20: 5 x 5 patches; two blocks per stage and small
# windows, so every second block shifts them).
defaults:
  - /surrogate/test/training

name: ssrolling_roll3
architecture:
  embed_dim: 32
  num_heads: 2
  encoder_depths: [2, 2]
  encoder_num_heads: [2, 4]
  decoder_depths: [2, 2]
  decoder_num_heads: [4, 2]
  window_size: [2, 2, 2]
  ssgen_channels: 16
  n_levels: 6
