# @package _global_
defaults:
  - training

name: latent_generator
autoencoder_dir: ${paths.weights_dir}/autoencoder
architecture:
  param_history_steps: 2
  # Pinned: the real config's values change between runs.
  num_heads: 8
  film_hidden: 128
  mlp_ratio: 4
  velocity_conditioning: input_film
  # Below D (768 for the S autoencoder), reached by the per-channel skip.
  hidden_size: 176
  n_layers: 6
  latent_skip: true
  gaussian_skip: false
trainer:
  lr_min: 1.0e-6
latent_stats:
  max_batches: 2
# Never the user's copy: a test that wants one passes its own dir.
latent_cache:
  output_root: null
