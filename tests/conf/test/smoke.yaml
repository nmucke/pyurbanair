# @package _global_
# Small solver shape shared by forward, ESMDA, and filtering integration tests.
# A prior full-suite benchmark found no speedup from halving nx/ny and shortening
# spinup; fixed process, import, compile, and I/O costs dominate at this size.
# Keep even nx/ny for PALM, bounds wide enough for x=18 sensors, a 3 s window
# for assimilation aggregation, and at least two members for ensemble updates.
domain:
  nx: 20
  ny: 20
  nz: 4
  bounds: [[0.0, 20.0], [0.0, 20.0], [0.0, 10.0]]

time:
  simulation_time: 3.0
  output_frequency: 1.0
  spinup_time: 3.0
  seconds_per_knot: 1.5

ensemble:
  ensemble_size: 2
  num_parallel_processes: 1

# The production Xie and Castro held-out sensors are outside the small domain.
# Keep one fluid-cell sensor in range so validation metrics still run. These
# fields are absent from Barcelona's case, so the overlay adds them there too.
obs:
  validation_x_points: [16.0]
  validation_y_points: [18.0]
  validation_z_points: [2.0]
