# P3D — xlarge preset. P3D_L (hidden 256, 8 heads). window_size fixed at 4
# upstream and ignored by the wrapper for this size.

_target_: neural_surrogates.P3D
size: L
partition_size: 1

# normalize: true / predict_residual: true / param_conditioning: native (defaults)

# Geometry features: uncomment to add SDF channels to the stem, right after the
# geometry mask. `sdf_features` selects which: `sdf` (+1), `grad` (+3) or `both`
# (+4). Must match dataset.sdf_features (same mode) and dataset.sdf_clamp_cells
# (default 32). Default `none` -> existing checkpoints load byte-identically.
# sdf_features: both  # none | sdf | grad | both
# sdf_clamp_cells: 32

# State history: number of past frames fed to the model. The dataset ships them
# pre-flattened along the channel axis (oldest first), so only the input stem
# widens -- the output stays `n_state_channels`. Must match
# dataset.num_history_steps. Default 1 -> existing checkpoints load
# byte-identically.
# num_history_steps: 1
