# @package _global_
# Fixed CPU test defaults; fixture/caller supplies temporary data paths.
defaults:
- _self_
model_name: latent_generator_s
pretrained_ae_dir: model_weights/tadpole_ae_s_new
architecture:
  _target_: neural_surrogates.TadpoleLatentGenerator
  param_history_steps: 12
  hidden_size: null
  n_layers: 4
  num_heads: 8
  time_embed_dim: 64
  film_hidden: 128
  mlp_ratio: 4
  use_checkpoint: false
  normalize: true
  num_sampling_steps: 2
  latent_eps: 1.0e-06
  max_latent_tokens: 4096
dataset:
  _target_: neural_surrogates.SnapshotHistoryDataset
  root_dir: .temp/tests/training_data
  state_vars:
  - u
  - v
  - w
  param_vars:
  - inflow_angle
  - velocity_magnitude
  param_history_steps: ${architecture.param_history_steps}
  time_stride: 1
  random_crop_size: null
  sdf_features: null
  sdf_clamp_cells: null
  constant_prehistory: true
  cadence_rtol: 0.1
  cache: false
  dtype: float32
physical_metadata:
  units:
    u: m/s
    v: m/s
    w: m/s
    inflow_angle: deg
    velocity_magnitude: m/s
    pressure_gradient_magnitude: m/s^2
  geometry_mask_convention: 'blanking: 1 = obstacle; model fluid mask = 1 - blanking'
  coordinate_order:
  - z
  - y
  - x
  boundary_conditions: 'uDALES inflow-outflow (BCxm=2): synthetic-turbulence inlet at x-min (intensity
    0.25, L=12 m), convective outflow at x-max; periodic in y (BCym=1); pressure top allowing vertical
    velocity (BCtopm=3); immersed-boundary no-slip walls from the xie_and_castro STL + ground; sponge
    nudging to a power-law inflow profile (tnudge=15 s, 16 m, interior nudging on).'
  constant_forcing_notes: ''
latent_stats:
  max_batches: 50
  seed: 0
trainer:
  _target_: neural_surrogates.LatentFlowMatchingTrainer
  num_epochs: 1
  device: cpu
  patience: 20
  amp: false
  amp_dtype: bfloat16
  compile_model: false
  compile_dynamic: null
  channels_last: false
  cudnn_benchmark: true
  tf32: true
  lr_warmup_epochs: 5
  lr_warmup_start: 1.0e-06
  lr_min: 1.0e-06
  grad_clip_norm: 1.0
  resume: true
  checkpoint_every: 5
  val_seed: 0
loss:
  _target_: torch.nn.MSELoss
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.01
batch_sampler:
  _target_: neural_surrogates.TrajectoryBatchSampler
  batch_size: 1
  cell_budget: 393216
  shuffle: true
  drop_last: true
  seed: 0
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 1
  shuffle: true
  drop_last: true
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  collate_fn:
    _target_: neural_surrogates.snapshot_history_collate
    _partial_: true
paths:
  output_dir: .temp/tests/model_weights
