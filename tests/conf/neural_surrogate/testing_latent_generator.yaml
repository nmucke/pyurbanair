# @package _global_
# Fixed CPU test defaults; fixture/caller supplies temporary data paths.
model_dir: model_weights/latent_generator_s
output_dir: ${model_dir}/output
device: cpu
spatial_mode: local
data:
  root_dir: null
  split: test
  max_snapshots: 2
  seed: 0
sampling:
  num_steps_sweep:
  - 5
  - 25
  - 50
  - 100
  num_noise_seeds: 4
  batch_size: 4
conditioning:
  constant_history: true
  shuffled_history: true
  omitted_history: true
rollout:
  enabled: false
  stepper_model_dir: null
  num_steps: 20
state_plots:
  enabled: true
  max_trajectories: 4
  snapshots_per_trajectory: 1
  num_generated: 2
  z_level: null
  y_level: null
divergence:
  stencil: central
distribution:
  max_values: 200000
  n_bins: 64
bootstrap:
  n_resamples: 200
acceptance:
  profile_rmse_factor: 2.0
  w1_factor: 2.0
  divergence_factor: 3.0
  diversity_min_ratio: 0.25
