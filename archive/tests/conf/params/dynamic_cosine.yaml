# Independent frozen test configuration.
_target_: pyurbanair.dynamic_parameters.harmonic.HarmonicParameterModel
_convert_: all
seed: 0
simulation_time: ${time.simulation_time}
seconds_per_knot: ${time.seconds_per_knot}
profiles:
  inflow_angle:
    waveform: cosine
    offset: 0.0
    amplitude: 25.0
    frequency: 0.0025
  velocity_magnitude:
    waveform: cosine
    offset: 7.5
    amplitude: 0.75
    frequency: 0.005
    min: 0.1
static_parameters:
  vertical_inflow_exponent:
    _target_: pyurbanair.static_parameters.Constant
    value: 0.25
