# UPT — large preset.

_target_: neural_surrogates.UPT
dim: 384
num_latent_tokens: 256
num_supernodes: 512
gnn_dim: 256
enc_depth: 4
approx_depth: 6
dec_depth: 4
num_heads: 6
radius: 5.0
max_degree: 32
# Self-attention impl: dot_product (default), dot_product_slow, efficient,
# linformer, transsolver (see attention_kwargs for transsolver/linformer extras).
attention_type: dot_product

# State history: number of past frames fed to the model. The dataset ships them
# pre-flattened along the channel axis (oldest first), so only the input stem
# widens -- the output stays `n_state_channels`. Must match
# dataset.num_history_steps. Default 1 -> existing checkpoints load
# byte-identically.
# num_history_steps: 1
