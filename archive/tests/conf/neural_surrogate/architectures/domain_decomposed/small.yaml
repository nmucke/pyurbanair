# Independent frozen test configuration.
defaults:
- /neural_surrogate/architectures/unet_convnext@fine_net: small
- /neural_surrogate/architectures/unet_convnext@coarse_net: small
- _self_
_target_: neural_surrogates.DomainDecomposed
_recursive_: false
_convert_: all
decomposition:
  interior_size: 32
  halo: 8
  taper: 4
  coarsen_factor: 4
  n_pos: 3
  boundary_mode: replicate
  periodic_axes:
  - false
  - true
  - false
  geometry_coarsen: any_fluid
fine_chunk_size: 8
fine_checkpoint: true
divergence_projection: false
