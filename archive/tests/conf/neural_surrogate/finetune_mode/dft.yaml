# @package _global_
# Independent frozen test configuration.
finetune_mode: dft
architecture:
  _target_: neural_surrogates.TadpoleTimeStepper
  size: S
  spatial_mode: global
  halo_size: 16
  pretrained_ae_dir: model_weights/tadpole_ae_s_new
  subnetwork: default
  subnetwork_cfg:
    use_checkpoint: false
    in_context_patches: -1
  skip_mixing:
    width: 32
    levels:
    - 4
    - 8
  param_conditioning: film
  latent_type: mode
  encoder_crop_size: 16
  encode_geometry: false
  sdf_features: both
  sdf_clamp_cells: 32
  geometry_branch:
    width: 32
  max_internal_batchsize: null
  normalize: true
trainer:
  _target_: neural_surrogates.Trainer
loss:
  _target_: torch.nn.MSELoss
lora:
  variant: standard
  rank: 32
  alpha: 64
  dropout: 0.0
  target_preset: tadpole_encdec
  target_modules: null
  modules_to_save: []
trainable_modules:
- subnetwork
- latent_residual_scale
- skip_mixing
- dft.decoder.conv_decoder.scales
- dft.decoder.transformer_decoder.scales
