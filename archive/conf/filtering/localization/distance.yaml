# @package filtering
# Distance-based localization — the same strategy the ESMDA smoother uses (see
# conf/esmda/localization/distance.yaml). Select with
# `filtering/localization=distance`.
#
# Requires state rows (filtering.mode=state or joint) and coordinate-based
# observations. Applied to the STATE rows only; parameter rows always get the
# global update.
localization:
  _target_: data_assimilation.localization.distance.DistanceLocalization
  # Localization radius (truncation distance) in domain length units.
  localization_radius: 10.0
  # Fraction of the radius left un-tapered (beta in Eq. 9).
  tapering_beta: 0.5
  # Maximum error-variance inflation E_max reached at the radius.
  max_inflation: 4.0
  # Grid-block joint analysis: co-located state rows (u/v/w at one cell) share
  # one observation selection + transition.
  block_grouping: true
  # Use only the horizontal (x, y) distance, ignoring vertical separation.
  horizontal_only: false
