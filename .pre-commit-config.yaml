# Vendored third-party code is kept byte-for-byte upstream: skip every hook
# (black/isort/mypy reformat + type-check explicitly-passed files, which
# tool-config excludes don't cover). Currently just the vendored Tadpole
# autoencoder subtree (neural_surrogates.architectures._tadpole).
exclude: '(^|/)_tadpole/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
