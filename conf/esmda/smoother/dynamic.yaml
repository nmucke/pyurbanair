# Time-varying parameter ESMDA smoother (each (time, parameter) knot is its own
# scalar in the augmented state). Pair with `params@prior_params=dynamic`.
#
# `num_time_points` comes from the single knot-count source
# `${time.num_param_knots}` (inlined in run_esmda.yaml); `time_coords` themselves are
# supplied by run_esmda.py at instantiate time from the sampled dynamic prior's
# `time` coordinate. `pin_initial_time_point` is re-toggled per window by the
# script (free at window 0, pinned thereafter for cross-window continuity).
_target_: data_assimilation.smoothing.esmda.TimeVaryingParameterESMDA
num_steps: ${esmda.num_steps}
alpha: ${esmda.alpha}
pin_initial_time_point: true
localization: ${esmda.localization}
num_time_points: ${time.num_param_knots}
