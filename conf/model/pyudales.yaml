name: pyudales
solver_name: udales

forward_model:
  _target_: pyudales.forward_model.ForwardModel
  _convert_: all
  # Experiment dir (holds namoptions + STL) follows the selected `case`.
  case_dir: ${geometry.udales_case_dir}
  # Optional: reuse precomputed IBM geometry (solid_*/fluid_boundary_*/
  # facet_sections_*) instead of re-running the expensive STL->IBM Fortran step
  # on every prepare. Defaults to null (generate from the STL) for any case that
  # does not set geometry.udales_precomputed_geom_dir. Relative to project root.
  precomputed_geom_dir: ${oc.select:geometry.udales_precomputed_geom_dir,null}
  # Base scratch dir shared across models; pyudales nests <temp_dir>/experiment/999.
  temp_dir: ${paths.experiment_dir}
  experiment_name: "999"
  matlab_bin: /opt/sw/matlab-2023b/bin/matlab
  ncpu: 1
  save_only_last_timestep: false
  verbose: false
  boundary_condition: inflow_outflow # periodic #  
  # Sub-grid-scale closure, written to &NAMSUBGRID as a mutually exclusive switch
  # set (the chosen one .true., the others .false.), so the closure comes from
  # this config rather than from whatever the case's namoptions template ships.
  #   vreman      -> lvreman=.true.;      constant c_vreman (Fortran default 0.07)
  #   smagorinsky -> lsmagorinsky=.true.; constant cs       (default -1 -> ~0.17)
  #   oneeqn      -> REJECTED: the one-equation closure needs a nonzero prof.inp
  #                  'tke' column, which the wrapper's preprocessing writes as 0,
  #                  and its constants (cm/ce1/ce2) are not in the namelist.
  # The `sgs_constant` parameter follows the closure automatically: it is written
  # to cs under smagorinsky and to c_vreman under vreman. The two are NOT on the
  # same scale (~0.17 vs 0.07) — retune the priors in conf/params/ when switching.
  # Set to null to leave the case template's switches untouched.
  closure: vreman
  # Per-backend SGS constant, written to whichever key `closure` selects
  # (cs under smagorinsky, c_vreman under vreman). This is the DEFAULT: a
  # `sgs_constant` in the params sampler (conf/params/*.yaml) overrides it, so
  # ESMDA can still estimate it. null -> leave the case template's value.
  #
  # NOTE the three backends' sgs_constant are NOT the same physical quantity, so
  # each config carries its own value: uDALES/pylbm take a dimensionless
  # Smagorinsky-family constant, PALM takes an eddy diffusivity in m^2/s.
  # 0.24 is the verified-stable c_vreman for this domain (0.07 and 0.15 diverge;
  # see the closure-fix commit) -- it sits near the stability floor, not at a
  # physical central estimate.
  sgs_constant: 0.24
  nudging_config:
    tnudge: 15.0
    # nnudge: number of bottom grid levels NOT nudged (raw level count).
    # nnudge: 2
    # nnudge_meters: height (m above the floor) below which nudging is NOT
    # applied. When set, it is converted to a level count and OVERRIDES nnudge.
    nnudge_meters: 16.0
    # interior_nudging: whether the domain INTERIOR is relaxed toward the
    # nudging profile (&PHYSICS lnudge -> modforces.f90::nudge, over
    # k = kb+nnudge .. ke). This is independent of the time-varying inflow
    # itself: ltimedepnudge stays on either way, and under
    # boundary_condition=inflow_outflow it is what drives the west inlet face
    # (modboundary.f90::xmi_profile reads uprof/vprof).
    #   true  (default) -> inlet face AND interior relaxation, as today.
    #   false           -> inflow applied at the boundary ONLY, matching pypalm,
    #                      which disables nudging entirely under inflow_outflow.
    # Only set false with inflow_outflow: under periodic BCs the interior
    # nudging is the only momentum source, so disabling it leaves an un-driven
    # domain (the dpdx/dpdy body force is written as zero).
    interior_nudging: true
    profile_config:
      type: power_law
      alpha: 0.25
  # Kill numerically-unstable runs early: when the adaptive timestep collapses
  # toward zero the run is terminated and reported as a failure, so the ensemble
  # resamples it from a successful donor instead of waiting for the slow crash.
  instability_check:
    enabled: true
    min_dt: 1.0e-4      # absolute timestep floor (s)
    patience: 20        # consecutive sub-floor steps before killing
    warmup_steps: 20    # ignore small startup dt for the first N steps
    poll_interval_s: 2.0
  # Turbulent inlet. Schema is shared across all three backends (`enabled` plus
  # backend-specific tunables); `intensity` here plays the role of pylbm's
  # `amplitude` and pypalm's `disturbance_amplitude`.
  #
  # uDALES' own Lund (1998) recycling generator (`iinletgen`) is unreachable
  # dead code in v2.2.0 (see docs/pyudales.md §6.1), so `enabled: true` drives
  # the *precursor/driver* route instead: BCxm=3 -> idriver=2, fed by driver
  # planes SYNTHESISED IN PYTHON — a mean profile from the same ESMDA
  # parameters the nudging path uses (velocity_magnitude / inflow_angle /
  # vertical_inflow_exponent) plus digital-filter turbulent fluctuations
  # (Xie & Castro 2008). No precursor run, no Fortran changes.
  #
  # Turning it on ALSO turns volume nudging off (lnudge/ltimedepnudge=.false.):
  # under BCxm=3 the inlet no longer comes from uprof, and relaxing the interior
  # toward a smooth mean would damp the injected fluctuations. It requires
  # boundary_condition=inflow_outflow.
  #
  # `enabled: false` (the default) is a strict no-op — namoptions stays
  # byte-identical and no driver files are written.
  inlet_turbulence:
    enabled: true
    intensity: 0.05        # u'_rms / |U_mean(z)|; v' and w' get 0.7x this
    length_scale_y: 6.0  # m — spanwise integral length scale of the eddies
    length_scale_z: 6.0  # m — vertical (defaults ~ building height; calibrate)
    length_scale_x: 6.0  # m — streamwise; sets the AR(1) time scale via Taylor
    time_step: 0.5        # s — &DRIVER dtdriver. Injected turbulence is
                          #     band-limited to ~1/(2*dtdriver) because the
                          #     solver interpolates linearly between records.
    driverjobnr: 998      # 3-digit driver-file suffix; must differ from expnr
    seed: null            # null -> derived from the member's experiment name
    # Large cases only: bound the resident driver arrays
    # ((jtot+2)*(ktot+2)*driverstore*8 B each) by reading the files in chunks.
    # lchunkread: true
    # chunkread_size: 100
  nx: ${domain.nx}
  ny: ${domain.ny}
  nz: ${domain.nz}
  bounds: ${domain.bounds}
  simulation_time: ${time.simulation_time}
  output_frequency: ${time.output_frequency}
  spinup_time: ${time.spinup_time}

prepare:
  _target_: pyurbanair.config.hydra_helpers.prepare_udales
  python_or_matlab: python

ensemble_model:
  _target_: pyudales.ensemble_forward_model.EnsembleForwardModel
  _convert_: all
  ensemble_size: ${ensemble.ensemble_size}
  num_parallel_processes: ${ensemble.num_parallel_processes}
  num_cpus_per_process: ${ensemble.num_cpus_per_process}
  failure: ${ensemble.failure}
