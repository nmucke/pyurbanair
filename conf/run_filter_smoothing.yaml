# Primary config (entry point) for scripts/filter_smoothing/run_filter_smoothing.py
# — windowed parameter-TRAJECTORY ESMDA with an inner EnKF state filter, the
# third assimilation entry point alongside run_esmda.yaml and run_filtering.yaml
# (see docs/plans/filter_smoothing_windowed_esmda.md).
#
# Self-contained: inlines the shared base (output paths, ensemble defaults, the
# `run:` namespace and Hydra settings) and selects the filter_smoothing groups.
#
# The algorithm: the high-dimensional STATE is estimated by a sequential EnKF
# that is never smoothed, while the low-dimensional parameter TRAJECTORY
# Theta = [theta_0 … theta_L] over the window is updated jointly by an outer
# ESMDA loop. Each of the `num_steps` ESMDA iterations runs one inner EnKF pass
# through all `num_cycles` cycles from the SAME initial state, records the raw
# pre-analysis forecast observations d_k = H(x_f_k), stacks them into
# D in R^{L*N_d x N_e} and applies one tempered Kalman update to the flattened
# trajectory. A final EnKF pass makes the state consistent with the final Theta.
#
# Declarative axes select the machinery:
#   * filter_smoothing/inner_analysis=stochastic|etkf|etkf_tsvd|letkf|letkf_tsvd
#                                              the INNER per-cycle state update
#                                              math. etkf* REQUIRES
#                                              filter_smoothing/inner_localization=none;
#                                              letkf* REQUIRES a non-null one.
#   * filter_smoothing/inner_localization=none|correlation|distance
#                                              spatial localization of the inner
#                                              state analyses
#   * filter_smoothing/inner_inflation=none|multiplicative|rtps|rtpp
#                                              inner ensemble spread maintenance
#   * filter_smoothing/temporal_localization=none|taper
#                                              localization of the OUTER
#                                              trajectory update in TIME
#   * filter_smoothing/evolution=none|random_walk
#                                              how the MOVING window's new
#                                              leading-edge knot is drawn from
#                                              the carried one (num_windows>1)
#   * filter_smoothing.num_cycles=L            cycles per window (the trajectory's
#                                              knot count is set separately, by
#                                              time.seconds_per_knot)
#   * filter_smoothing.num_windows=W           windows the window slides through
#                                              (1 -> one fixed window)
#   * filter_smoothing.window_shift=s          cycles the window slides by
#   * filter_smoothing.num_steps=N_a           outer ESMDA iterations
# and the truth source (mirrors run_filtering.yaml / run_esmda.yaml):
#   * run.truth_dir=null   -> simulate truth inline (default)
#   * run.truth_dir=<path> -> load a state.nc/params.nc artifact
#
# One cycle = one forecast segment of `time.simulation_time` seconds; set it
# equal to `obs.interval_seconds` to assimilate one observation interval per
# analysis. Unlike run_filtering.yaml, the PRIOR must be DYNAMIC (time-varying):
# this method estimates a whole parameter TRAJECTORY, so pair with
# `params@prior_params=dynamic` (AR(2)). `time.seconds_per_knot` sets that
# trajectory's resolution independently of the cycle length (see below); the
# script validates the sampled knot grid loudly and derives the trajectory length
# from it.
#
# Examples::
#
#   python scripts/filter_smoothing/run_filter_smoothing.py \
#     filter_smoothing.num_cycles=8 filter_smoothing.num_steps=4
#   python scripts/filter_smoothing/run_filter_smoothing.py \
#     filter_smoothing/temporal_localization=taper \
#     filter_smoothing.temporal_localization.temporal_radius=2  # in CYCLES
#   python scripts/filter_smoothing/run_filter_smoothing.py \
#     filter_smoothing/inner_analysis=etkf filter_smoothing/inner_localization=none
#   python scripts/filter_smoothing/run_filter_smoothing.py \
#     filter_smoothing/inner_analysis=letkf filter_smoothing/inner_localization=distance
#   python scripts/filter_smoothing/run_filter_smoothing.py \
#     filter_smoothing.num_cycles=8 filter_smoothing.num_windows=10 \
#     filter_smoothing.window_shift=2 filter_smoothing/evolution=random_walk
defaults:
  - case: xie_and_castro
  # `_self_` before the filter_smoothing/* groups so the base `filter_smoothing:`
  # scalars below are set first and the inner_analysis / inner_localization /
  # inner_inflation / temporal_localization groups can override them. The model /
  # params mounts write to their own packages.
  - _self_
  - filter_smoothing/inner_analysis: stochastic
  - filter_smoothing/inner_localization: distance
  - filter_smoothing/inner_inflation: rtps
  - filter_smoothing/temporal_localization: taper
  - filter_smoothing/evolution: none
  - model@truth_model: pyudales
  - model@assim_model: pyudales
  # Deterministic harmonic TRUTH trajectory (anti-inverse-crime: not a draw from
  # the assimilation prior's generative process) against an AR(2) prior
  # trajectory. Both MUST be dynamic here — the whole point is a time-varying
  # posterior. Swap the truth for params@truth_params=dynamic_truth for a
  # stochastic AR(2) truth.
  - params@truth_params: dynamic_sine
  - params@prior_params: dynamic

# --- Output roots (everything mutable lands under .temp/). Two model mounts
# (truth/assim) and no base `model`, so name the output by both backends. ---
paths:
  results_dir: .temp/filter_smoothing_${truth_model.name}_to_${assim_model.name}
  # Absolute scratch dir for the solvers (they chdir into it). Resolved from $PWD
  # so it also works under bare compose() in tests.
  experiment_dir: ${oc.env:PWD}/.temp
  base_results_dir: .temp_lbm

# --- Time-varying parameter knot spacing: the RESOLUTION of the estimated
# trajectory, and a free knob. It defaults to the cycle length (one knot per
# assimilation segment, the paper's shape) but is not tied to it: cycle k's
# forecast is handed the trajectory RESTRICTED to its segment — linearly
# interpolated at the segment's edges, with every knot strictly inside it carried
# through — as a time-varying schedule the backend interpolates natively. So a
# finer spacing resolves within-segment variation and a coarser one ramps a
# single knot interval across several cycles. Two constraints, both checked
# loudly by the script: the sampled grid must start at 0, be uniform at this
# spacing and reach the window's end; and with filter_smoothing.num_windows > 1,
# `window_shift * time.simulation_time` must be a whole number of knots, since
# the moving window slides the grid by exactly that many seconds. ---
time:
  seconds_per_knot: ${time.simulation_time}

# --- Which parameters the method estimates (same contract as run_filtering.yaml
# / run_esmda.yaml `params_to_estimate`: a list -> that subset of the sampler
# configs' params, applied to BOTH prior and truth; null -> every parameter they
# define). ---
# Only the time-varying knobs both samplers define are estimated by default. The
# constant-in-time model-error parameters (conf/params/dynamic.yaml's
# `static_parameters`) are excluded here: Phase 1 carries static, no-`time`
# variables through the forecasts unchanged and leaves them out of the outer
# trajectory update, so estimating them needs an explicit opt-in.
params_to_estimate:
  - inflow_angle
  - velocity_magnitude

# --- Ensemble execution. Override per run on the CLI, e.g.
# `ensemble.ensemble_size=128 ensemble.num_parallel_processes=8`. ---
ensemble:
  ensemble_size: 50
  num_parallel_processes: 8
  num_cpus_per_process: 1
  failure:
    policy: resample_from_successes
    jitter_scale: 0.05
    seed: 0

# --- Filter-smoothing settings. The estimator itself (the `smoother:` block)
# composes the inner analysis / inner localization / inner inflation and the
# temporal localization selected by the groups above. ---
filter_smoothing:
  # Window length L: cycles per window, i.e. observation batches one outer ESMDA
  # update assimilates at once. Each cycle forecasts one segment of
  # `time.simulation_time` seconds, so the window spans
  # num_cycles * time.simulation_time seconds. How many KNOTS the estimated
  # trajectory has over that span is a separate question, answered by
  # `time.seconds_per_knot` above (they are equal only at the default spacing).
  num_cycles: 24
  # Number of windows W the fixed-lag window slides through. 1 (the default) is
  # the single fixed window: one run() call over num_cycles cycles, byte for
  # byte the Phase 1 path. W > 1 turns on the moving window of the paper's §8:
  # after each window's ESMDA loop converges, the window advances by
  # `window_shift` cycles — the oldest shifted-out knots are FINALIZED (fixed
  # once they leave the window), the overlapping knots become the next window's
  # prior, the carried state ensemble continues from cycle `window_shift` of the
  # final consistency pass, and `window_shift` fresh leading-edge knots are
  # appended per member by `filter_smoothing/evolution`.
  num_windows: 1
  # Cycles the window slides by per step, s in [1, num_cycles]. s = 1 is the
  # maximally overlapping fixed lag (every knot is revisited num_cycles times
  # before it is finalized, at num_windows times the cost of one window);
  # s = num_cycles is the non-overlapping regime (each cycle assimilated once,
  # only the carried state and the appended knots link the windows).
  window_shift: 1
  # TOTAL horizon: T = num_cycles + (num_windows - 1) * window_shift cycles, so
  # window w (0-based) consumes observation batches [w*s, w*s + L). The truth is
  # simulated and observed over all T cycles; the PRIOR trajectory is still
  # sampled over the first window only (L(+1) knots) — later windows get their
  # prior from the previous window's posterior, not from the sampler.
  # Outer ESMDA iterations N_a. Each one is a full inner EnKF pass through the
  # window, so the forward-model cost is (num_steps + 1) * num_cycles segments
  # per member — the +1 is the final consistency pass.
  num_steps: 2
  # Tempering weight. null -> the estimator defaults to alpha = num_steps (equal
  # weights, the usual ESMDA convention, sum of 1/alpha_i == 1). A scalar
  # override applies the same alpha to every iteration, and the schedule check
  # therefore REQUIRES it to equal num_steps — override both together or leave
  # this null. So this is not a tuning knob: setting it can only restate
  # num_steps. To temper more gently, raise num_steps (each update then moves
  # the trajectory 1/num_steps of the way, at one more inner pass of cost); a
  # non-uniform schedule would need a per-iteration sequence, which the
  # estimator does not currently accept.
  alpha: null
  seed: 42
  obs_error_std: 0.25
  # Common random numbers across the outer iterations: the inner stochastic
  # analysis (and any inflation noise) reuse ONE key per window, so the map
  # Theta -> D is pseudo-deterministic and the ESMDA cross-covariances are not
  # diluted by fresh Monte Carlo noise between iterations. The OUTER
  # perturbed-observation draws always use fresh subkeys either way. Set false
  # for independent inner draws.
  common_inner_noise: true
  # Defaults; normally set by the filter_smoothing/* groups above.
  inner_analysis: stochastic
  inner_localization: null
  inner_inflation: null
  temporal_localization: null
  # Leading-edge parameter evolution for the moving window. Unlike the four keys
  # above it is NOT a collaborator of the `smoother:` node below: the estimator
  # knows nothing about windows sliding, so the script instantiates this and
  # hands it to the moving-window orchestrator. null -> IdentityEvolution.
  evolution: null
  smoother:
    _target_: data_assimilation.filter_smoothing.FilterSmoothingESMDA
    _convert_: all
    # Seconds one cycle's forecast segment spans — the unit that places a cycle
    # on the trajectory's (physical, seconds-valued) knot axis, and the unit of
    # `temporal_localization.temporal_radius`. Always the cycle length; it is a
    # constructor argument rather than a read off the forward model so the
    # estimator stays usable with a model that does not expose one.
    cycle_length: ${time.simulation_time}
    num_steps: ${filter_smoothing.num_steps}
    alpha: ${filter_smoothing.alpha}
    inner_analysis: ${filter_smoothing.inner_analysis}
    inner_localization: ${filter_smoothing.inner_localization}
    inner_inflation: ${filter_smoothing.inner_inflation}
    temporal_localization: ${filter_smoothing.temporal_localization}
    common_inner_noise: ${filter_smoothing.common_inner_noise}

run:
  results_dir: null
  # When true, inner ensemble forecasts are written to disk (one NetCDF per
  # member, per cycle, under cycle_{k}/ dirs) instead of one in-memory ensemble
  # Dataset. Every outer iteration rewrites the same cycle dirs; only the final
  # pass's files survive the run.
  ensemble_save_on_disk: false
  # Save the final pass's per-cycle analyzed params/state histories
  # (params_history.nc / state_history.nc; the state history holds final frames
  # only, so it stays small). The per-iteration trajectory ensembles
  # (params_iterations.nc) ride along with it. The per-iteration and per-cycle
  # diagnostics YAMLs are always saved.
  save_history: true
  # Truth source: null -> simulate inline (default); a path -> load a
  # state.nc/params.nc artifact written by run_forward_model.py.
  truth_dir: null
  # Begin the assimilation horizon partway into a disk-loaded truth (skips a
  # spin-up): frames before this time are dropped and the axis rebased so it
  # becomes t=0. null/0 -> start from the truth's first frame.
  truth_start_time: null

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.results_dir}/hydra/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
