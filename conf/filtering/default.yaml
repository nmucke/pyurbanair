# Shared scalar filtering settings and filter target. Components live in selected groups.
# Assimilation windows, exactly as `esmda.num_assimilation_windows`: one
# window spans `time.simulation_time` seconds, so the experiment horizon is
# `num_assimilation_windows * time.simulation_time`. The cycles are DERIVED,
# not configured: one cycle is one observation interval
# (`time.output_frequency` s) ending in one full-weight analysis, so a window
# holds `time.simulation_time / time.output_frequency` of them (divided by
# `assimilate_every_n_step`, below). Still no aggregation knobs: the filter
# assimilates individual frames and never averages them — aggregation stays
# with the ESMDA smoothers.
#
# A window boundary is a CHUNKING boundary only (one `run()` call and one set
# of per-window artifacts each, so RAM and peak disk stay bounded): the
# analyzed state, the parameters, the filter's PRNG stream and the per-cycle
# observation-noise draws are all carried across it, so the same horizon run
# as 1 window or as W windows gives identical results. Keep W in the ESMDA
# range (2-10) for comparable runs and readable per-window diagnostics.
num_assimilation_windows: 3
# Analysis STRIDE: assimilate only every n-th observation frame (1 = every
# frame, the every-observation filter above; n > 1 thins the analyses without
# touching the model's output cadence). A cycle then spans
# `n * time.output_frequency` seconds and assimilates the LAST frame of its
# segment — the analysis time; the intermediate frames are still SIMULATED
# and still written out (they are in the per-cycle
# `_ensemble_states/cycle_{k}/` segments in full), they just never see a
# Kalman step, so the ensemble runs n intervals between analyses. The
# in-memory histories (state_history.nc, the per-window state files) hold the
# analysis-time frames only. `n` MUST divide
# `time.simulation_time / time.output_frequency` so the cycles still tile a
# window; the run refuses to start otherwise.
assimilate_every_n_step: 1
seed: 42
# Likelihood tempering: every analysis uses `beta * R` (R = the physical
# observation-error variances from `observation_error`, conf/observation/
# error.yaml) instead of R, i.e. L^(1/beta), so beta > 1 weakens each
# analysis. Must be a finite number >= 1; 1.0 = the untempered filter, bit for
# bit. A multiplier of R — NOT ensemble-spread inflation (filtering/inflation)
# and NOT localization's `tapering_beta`. The recorded observation-error
# artifacts and the innovation chi2 stay physical. The ESMDA x filter hybrid
# (run_filter_smoothing.py) forwards `filter_smoothing.beta` into this key.
beta: 1.0
# state | parameter | joint. The parameter-updating modes (parameter and
# joint) REQUIRE spread maintenance (filtering/evolution=random_walk or a
# filtering/inflation option) — the filter refuses silently-collapsing
# configurations at construction.
mode: joint
# Defaults; normally set by the filtering/* groups above.
filter:
  _target_: data_assimilation.filtering.EnsembleKalmanFilter
  _convert_: all
  mode: ${filtering.mode}
  analysis: ${filtering.analysis}
  localization: ${filtering.localization}
  state_reduction: ${filtering.state_reduction}
  inflation: ${filtering.inflation}
  parameter_evolution: ${filtering.parameter_evolution}
  beta: ${filtering.beta}
