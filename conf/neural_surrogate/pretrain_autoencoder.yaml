# @package _global_
#
# Tadpole-style (V)AE pre-training (plan 02): representation learning on flow
# snapshots, NO next-step objective. Trains a `TadpoleAE` with the
# `AutoencoderTrainer` on a `SnapshotDataset` split and writes the standard
# `model_weights/<model_name>/` layout (config.yaml + full weights.pt), plus
# `encoder.pt` / `decoder.pt` (the handoff format for plan 03). Entry point:
#   scripts/neural_surrogate/pretrain_autoencoder.py
#
#   pixi run -e dev python scripts/neural_surrogate/pretrain_autoencoder.py \
#     dataset.root_dir=training_data/pylbm_barcelona model_name=tadpole_ae_s
#
# Unlike training.yaml this has no `mode` group: the AE is a single trainer +
# architecture pairing, so everything is inline.

defaults:
  - _self_

# Where the pre-trained model lands: model_weights/<model_name>/.
model_name: tadpole_ae_s

architecture:
  _target_: neural_surrogates.TadpoleAE
  # Upstream size S/B/L (8.8M / 38.1M / 152.1M params; latent compression
  # 16/8/4). n_state_channels is injected by the script from dataset.state_vars.
  size: S
  # local: independent tiles (existing behavior); global: whole rectangular field;
  # halo: overlapping tiles, retaining their central cores. All modes encode
  # each state channel independently. Global pads only to the encoder stride 16.
  spatial_mode: local
  # Extra context on EACH side of a halo tile, in cells (multiple of 16).
  # Used only by spatial_mode=halo; encoder_crop_size then sets the core size.
  halo_size: 16
  # Local tile / halo core size (ignored in global mode). MUST be a multiple of 16
  # (the encoder's total downsampling). Pick one that divides the trained grid
  # to avoid padding; the model zero-pads to a multiple of it otherwise.
  encoder_crop_size: 64
  # "sample" (VAE-proper) or "mode" (deterministic-AE ablation; pair with
  # loss.kl_weight: 0 for a plain AE).
  latent_type: sample
  # Encode the geometry mask (+ SDF channels, if any) as extra folded channels so
  # their latents are available to the plan-03 DFT sub-network. false = A/B it
  # (state channels only).
  encode_geometry: true
  # SDF / ∇SDF geometry features appended alongside the encoded mask (requires
  # encode_geometry: true, or a geometry_branch -- they feed the branch instead):
  # none | sdf (+1) | grad (+3) | both (+4). Must match dataset.sdf_features (the
  # script cross-checks it) and dataset.sdf_clamp_cells.
  sdf_features: sdf
  sdf_clamp_cells: 32
  # Geometry BRANCH: the alternative to folding geometry through the encoder.
  # null (default) = today's behaviour, byte-identical. A block here builds a
  # small conv net that turns [mask, SDF...] into features at strides
  # (1, 2, 4, 16); zero-init 1x1x1 projections inside the encoder/decoder add
  # them at the conv stem's stride 1/2/4 points, their mirror in the decoder's
  # up-path, and (level 3) the decoder's latent input. Geometry then CONDITIONS
  # the autoencoder instead of being encoded and reconstructed: no geometry
  # channels in the working space, no geometry recon term, and latent capacity
  # stays on the flow. Mutually exclusive with encode_geometry (set it false);
  # sdf_features stays available and feeds the branch. Because every projection
  # is zero-init the model reconstructs exactly as it would with the branch
  # disconnected, so training starts from the unconditioned AE. The branch is
  # saved next to encoder.pt/decoder.pt as geometry_branch.pt (the plan-03
  # stepper loads it frozen).
  geometry_branch: null
  # geometry_branch:
  #   # Base feature width; per-level widths default to (w, 2w, 4w, 8w). Pass
  #   # out_dims: [.., .., .., ..] to set all four explicitly.
  #   width: 32
  # Pretrained init: none (random) | hf (thuerey-group/Tadpole weights for this
  # size; needs huggingface_hub) | {encoder: path, decoder: path} (local files).
  # In geometry_branch mode the load is non-strict but still fails loud unless
  # the ONLY missing keys are the zero-init geom_proj / geom_latent_proj ones.
  pretrained: none
  # Cap on folded crops processed at once (bound memory); null = all together.
  max_internal_batchsize: null
  normalize: true

# Optional adversarial (GAN) loss. A pure MSE+KL autoencoder reconstructs the
# conditional MEAN, so it blurs away exactly the small-scale structure urban flow
# lives on (shear layers, wakes, the sharp gradients hugging building faces); the
# VQGAN/latent-diffusion fix is a patch critic that scores local patches of the
# reconstruction and rewards texture the pixel loss cannot see. `null` = the pure
# VAE path (default, unchanged): no critic, no second optimizer, no extra
# metrics.csv columns. Turn it on only if the reconstructions come out too smooth
# -- it adds GAN-tuning risk (mode collapse, a critic that outruns the AE) to an
# otherwise well-behaved objective.
discriminator: null
# discriminator:
#   _target_: neural_surrogates.TadpoleDiscriminator
#   # Paper (Appendix C.1) pairs the critic with a SAME-SIZE autoencoder; leave
#   # this unset and the script copies architecture.size. Set it to shrink the
#   # critic (e.g. S against a B autoencoder) if D memory is the constraint.
#   # size: S
#   # n_state_channels / encode_geometry / sdf_features are injected by the
#   # script from the architecture block so the D always sees exactly the same
#   # channels as the AE (a mismatch is a construction-time error in the trainer).
# disc_optimizer:
#   # The critic gets its OWN optimizer (Appendix C.3 lists it with its own LR):
#   # its loss is adversarial to the AE's, so the two must never share moments.
#   _target_: torch.optim.AdamW
#   lr: 5.0e-5
#   betas: [0.9, 0.999]
#   weight_decay: 1.0e-15

# VAE loss weights (the reconstruction metric itself is MSE, set in the script).
loss:
  # β: KL weight. Tiny by default (latent-diffusion convention). 0 with
  # latent_type: mode degrades to a plain deterministic autoencoder.
  kl_weight: 1.0e-6
  # Weight on reconstructing the geometry/SDF channels (only when
  # encode_geometry: true); keeps the total loss dominated by state recon.
  geometry_recon_weight: 0.1
  # -- adversarial knobs; all inert while `discriminator: null` --------------- #
  # MAXIMUM adversarial scale (paper: a gradient-based scale strategy with a
  # maximum scale value of 1e-4). The coefficient actually applied each step is
  #   ramp * adv_weight * lambda
  # with lambda in [0, 1] from the adaptive gradient balancing below, so the
  # effective weight lives in [0, 1e-4] -- deliberately small: the adversarial
  # term is a texture prior on top of reconstruction, not a competing objective.
  adv_weight: 1.0e-4
  # Warm-up counted in GLOBAL OPTIMIZER STEPS, not epochs -- our snapshot corpora
  # differ in size by more than an order of magnitude, so an epoch is not a
  # portable unit (and the paper specifies iterations). The adversarial term is
  # exactly zero and the critic is not updated before `adv_start_step`, so the AE
  # learns to reconstruct before a critic starts pushing it; the coefficient then
  # ramps linearly from 0 to full over `adv_ramp_steps` further steps (full
  # strength at ~step 2000 with the defaults). `adv_ramp_steps: 0` = step on at
  # full strength. The counter is persisted in checkpoint.pt, so resume continues
  # the schedule instead of restarting the warm-up.
  adv_start_step: 1000
  adv_ramp_steps: 1000
  # Esser et al. (2021) gradient balancing: scale the adversarial term by
  # ||d recon/d decoder_out|| / ||d adv/d decoder_out||, so the critic can never
  # out-gradient reconstruction and the weight needs no per-dataset tuning. Costs
  # two extra torch.autograd.grad probes per step. Set false (fixed
  # coefficient = ramp * adv_weight) to save that, or when running under fp16
  # loss scaling -- see the AMP note in training/autoencoder.py.
  adaptive_adv_weight: true
  # Optional upstream-style gate: only update the critic once the masked L2
  # reconstruction loss is BELOW this, so a strong critic cannot overpower an
  # untrained AE. Upstream uses 1e-3, but that threshold is tied to their state
  # normalisation, not ours -- hence null (no gate) by default; pick a value from
  # a pure-VAE run's `train_recon` curve if the critic runs away. Reading it costs
  # a host<->device sync per step, so leave it null unless you need it.
  disc_recon_threshold: null

# AE trainer. Shares BaseTraining machinery (amp, warmup+cosine LR, grad clip,
# early stopping, checkpoint/resume, metrics.csv) but has NO pushforward
# curriculum (a snapshot AE has no time dimension).
trainer:
  _target_: neural_surrogates.AutoencoderTrainer
  num_epochs: 200
  device: cpu
  patience: 20
  amp: true
  amp_dtype: bfloat16
  # torch.compile off by default (the transformer AE + the dev box's lack of a
  # CUDA triton); turn on for long GPU runs.
  compile_model: false
  channels_last: false
  cudnn_benchmark: true
  tf32: true
  lr_warmup_epochs: 5
  lr_warmup_start: 1.0e-6
  lr_min: 1.0e-6
  # Restrict the state reconstruction loss to fluid cells (obstacle cells carry
  # no signal).
  mask_loss: true
  grad_clip_norm: 1.0
  resume: true
  checkpoint_every: 5

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-8

dataset:
  _target_: neural_surrogates.SnapshotDataset
  root_dir: training_data/pyudales_idealized
  # root_dir: /export/scratch2/ntm/pyudales_medium
  state_vars:
    - u
    - v
    - w
  # Sample every Nth time slice to decorrelate snapshots (1 = every frame).
  time_stride: 1
  # Random spatial crop per item (the paper's intermediate pre-cropping): more
  # crop diversity per epoch, smaller batches. null = full field (and the
  # shared-geometry collate fast path). A multiple of encoder_crop_size avoids
  # in-model padding.
  random_crop_size: null
  cache: false
  dtype: float32
  # Must match architecture.sdf_features / sdf_clamp_cells.
  sdf_features: sdf
  sdf_clamp_cells: 32

# Optional trajectory-bucketed batch sampler.
#
# The default (null) plain shuffled DataLoader only supports a SINGLE-GEOMETRY
# (or uniform-grid) split: with `random_crop_size: null`, a shuffled batch that
# mixes trajectories of different grid shapes hits `snapshot_collate`'s
# default_collate fallback, which raises on mismatched tensor shapes. For a
# MULTI-GEOMETRY snapshot corpus (root produced by
# generate_random_geometries_training_data.py) set this block: it draws every
# batch from a single trajectory (one grid/geometry), exactly as for
# TransitionDataset (see training.yaml for the full argument contract). The
# shipped `pylbm_barcelona` target is single-geometry, so it stays null: the
# default below is the plain shuffled DataLoader (batch_sampler: null), which
# honours dataloader.batch_size / shuffle / drop_last as written.
#
# To opt in for a multi-geometry corpus, comment out `batch_sampler: null` and
# uncomment the TrajectoryBatchSampler block. NOTE (see docs Part G): once
# enabled the sampler REPLACES dataloader.batch_size / shuffle / drop_last (they
# become dead knobs, neutralised in training/data_utils.py), batches never mix
# trajectories, and on grids >= ~2.1M cells cell_budget: 4194304 silently drops
# the per-trajectory batch size to 1 (max(1, cell_budget // cells_per_sample)).
batch_sampler: null
# batch_sampler:
#   _target_: neural_surrogates.TrajectoryBatchSampler
#   batch_size: 2
#   cell_budget: 4194304
#   shuffle: true
#   drop_last: true
#   seed: 0

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 2
  shuffle: true
  drop_last: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  # Ship the (shared) geometry mask + SDF features once per batch; falls back to
  # stacking per-sample geometry when random-cropping.
  collate_fn:
    _target_: neural_surrogates.snapshot_collate
    _partial_: true
