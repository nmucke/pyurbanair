# Domain-decomposed surrogate — small preset. Two-level overlapping DD wrapping
# a per-patch fine net and a small dedicated coarse net.
#
# Both sub-nets are composed BY REFERENCE from the existing architecture presets
# (the `defaults` below) and instantiated by the wrapper via Hydra -- so their
# hyperparameters live in one place (architectures/<family>/<size>) and any
# family is swappable here, e.g.
#   - /neural_surrogate/architectures/upt@coarse_net: tiny
defaults:
  - /neural_surrogate/architectures/unet_convnext@fine_net: small
  - /neural_surrogate/architectures/unet_convnext@coarse_net: small
  - _self_

_target_: neural_surrogates.DomainDecomposed
# The wrapper instantiates fine_net / coarse_net itself (injecting the channel
# counts and overriding extra_in_channels / periodic_axes), so Hydra must NOT
# recurse into those nodes. `_convert_: all` passes them as plain dict/list.
_recursive_: false
_convert_: all

# Two-level overlapping tiling. interior_size must divide any periodic axis
# length exactly (y is periodic here -> Ny % interior_size == 0).
decomposition:
  interior_size: 32
  halo: 8
  taper: 4
  coarsen_factor: 4
  n_pos: 3
  boundary_mode: replicate
  # (z, y, x) periodicity. The uDALES runs are spanwise (y) periodic; x
  # (inflow-outflow) and z (ground/top) are not. Global periodicity lives
  # here, never on the inner nets.
  periodic_axes: [false, true, false]
  # A coarse cell is fluid if ANY fine cell in its window is fluid -- keeps
  # thin fluid corridors visible to the coarse pressure field.
  geometry_coarsen: any_fluid

# fine_net / coarse_net hyperparameters come from the referenced presets above.
# The wrapper injects n_state_channels / n_params, widens the fine stem with
# extra_in_channels (context + positional), and forces periodic_axes=() on both
# inner nets. Override any preset key by adding it under `fine_net:` / `coarse_net:`.

# Patch-batch streaming to bound GPU memory on large grids. The fine step runs
# the fine net on B*M overlapping blocks; on a big domain (e.g. Barcelona) M is
# large enough to OOM even at batch_size=2. fine_chunk_size caps how many blocks
# go through the fine net per call (transient working set); fine_checkpoint
# recomputes each call's activations in backward (saved-activation memory, the
# part that actually pins ~all the memory while training). Use both together for
# the full reduction. Leave both unset (null / false) for the original single
# B*M call (byte-identical). Tune fine_chunk_size up for speed / down for memory.
fine_chunk_size: 8
fine_checkpoint: true

# Coarse-grid divergence-cleaning projection (Eq 8) is an identity stub; off.
divergence_projection: false
