# P3D — large preset. P3D_B (hidden 128). window_size is fixed at 4 upstream for
# B/L and is ignored by the wrapper for these sizes.

_target_: neural_surrogates.P3D
size: B
partition_size: 1

# normalize: true / predict_residual: true / param_conditioning: channels (defaults)

# Geometry features: uncomment to add the SDF + ∇SDF channels to the stem
# (in_channels += 4). Must be paired with dataset.sdf_features=true and a
# matching dataset.sdf_clamp_cells (default 32). Off by default -> existing
# checkpoints load byte-identically.
# sdf_features: true
# sdf_clamp_cells: 32
