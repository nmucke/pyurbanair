# P3D — medium preset. P3D_S (hidden 64), window 4, with the global-context
# region partition enabled (the paper's "messenger token" split). partition_size
# must divide the padded grid along every axis; keep it 1 unless the grid is
# known to be cleanly divisible.

_target_: neural_surrogates.P3D
size: S
window_size: 4
partition_size: 1
sdf_features: both  # none | sdf | grad | both
sdf_clamp_cells: 32

# normalize: true / predict_residual: true / param_conditioning: native (defaults)

# Geometry features: `sdf_features` selects which SDF channels join the stem,
# right after the geometry mask -- `sdf` (+1), `grad` (+3) or `both` (+4).
# Must match dataset.sdf_features (same mode) and dataset.sdf_clamp_cells
# (default 32). `none` -> existing checkpoints load byte-identically.
