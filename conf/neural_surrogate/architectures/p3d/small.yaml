# P3D — small preset. P3D_S (hidden 64) at the upstream default window size.

_target_: neural_surrogates.P3D
size: S
window_size: 4
partition_size: 1

# normalize: true / predict_residual: true / param_conditioning: native (defaults)

# Geometry features: uncomment to add SDF channels to the stem, right after the
# geometry mask. `sdf_features` selects which: `sdf` (+1), `grad` (+3) or `both`
# (+4). Must match dataset.sdf_features (same mode) and dataset.sdf_clamp_cells
# (default 32). Default `none` -> existing checkpoints load byte-identically.
# sdf_features: both  # none | sdf | grad | both
# sdf_clamp_cells: 32
