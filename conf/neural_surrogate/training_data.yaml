# @package _global_
#
# Entry point for scripts/neural_surrogate/generate_training_data.py — the single
# training-data generation config (replaces the former conf/training_data/ group
# + conf/generate_training_data.yaml; dataset shape taken from the old medium preset).
#
# The PHYSICAL setup is picked by `training_data.geometry.source`:
#   barcelona | xie_and_castro — the single-geometry named cases; the case's
#     domain/geometry/time replace the composed `case` selection, so the yaml
#     knob alone switches geometry (generate_training_data.py).
#   idealized | realistic — the UrbanTALES STL pools under
#     examples/geometries/processed/<source>; geometries are randomly sampled
#     per simulation and the grid is derived per geometry from the STL extent
#     (generate_random_geometries_training_data.py).
# Override on the CLI as usual, e.g.
# `model=pylbm training_data.geometry.source=realistic training_data.num_train=256`.
defaults:
  - /run_forward_model
  # Backend selection lives here so the whole data-generation setup is this
  # one file; `model=pylbm` on the CLI still wins over this entry.
  - override /model@model: pyudales
  - _self_

training_data:
  num_train: 250
  num_val: 5
  num_test: 5

  output_dir: training_data/${model.name}_${training_data.geometry.source}/

  # --- Geometry source --------------------------------------------------
  geometry:
    source: idealized

    # Pool + per-backend case-template locations, derived from `source`.
    # Only consumed for the pool sources (idealized/realistic); the named
    # cases carry their own paths in conf/case/<source>.yaml.
    stl_dir: examples/geometries/processed/${training_data.geometry.source}
    udales_case_dir: examples/udales/${training_data.geometry.source}
    palm_case_dir: examples/palm/${training_data.geometry.source}

    # Grid spacing in metres, identical in x, y and z. Per geometry, nx/ny are
    # derived from the physical domain size (the pool's manifest.csv, with a
    # mesh-bounds fallback) and rounded UP to a multiple of 16 cells — the
    # domain is extended (never the mesh), so the extra cells are open fluid.
    # They are placed around the geometry, not just behind it:
    #   x — `upstream_padding` / `downstream_padding` below go in FRONT of and
    #       BEHIND the geometry, and the rounding slack tops up the wake;
    #   y — `lateral_padding` on both sides, plus the rounding slack split
    #       evenly over them (an odd cell count leaves the spare cell at the
    #       far side).
    resolution: 4.0

    # Open fluid (metres, each rounded up to a whole number of cells) inserted
    # in front of and behind the geometry in x, the streamwise direction:
    #   upstream_padding   — inflow fetch, so the inlet profile has room to
    #                        develop instead of being imposed on the first row
    #                        of buildings;
    #   downstream_padding — wake, so the last row does not sit on the outlet;
    #   lateral_padding    — applied to BOTH y sides, so the lateral boundaries
    #                        are clear of the buildings whichever way the
    #                        inflow_angle blows (the two sides are not
    #                        distinguishable, hence one knob rather than two).
    # All three are MINIMA: nx/ny cover geometry + padding rounded up to a
    # multiple of 16, and the rounding slack tops up the wake in x and is split
    # evenly over the two sides in y. All cost compute — at resolution 4.0 m
    # every 64 m is 16 extra cells, and lateral_padding is charged twice (both
    # sides). All 0.0 keeps the pre-knob behaviour: every spare cell behind the
    # geometry in x, only the rounding slack centred in y.
    upstream_padding: 32.0
    downstream_padding: 32.0
    lateral_padding: 16.0

    # Fixed vertical domain extent (m), shared by ALL sampled geometries.
    # z_size / resolution must itself be a multiple of 16. Geometries whose
    # tallest building reaches z_size are dropped from the pool with a
    # warning (pylbm SIGFPEs when buildings pierce the domain top).
    z_size: 64.0

  # Generation horizon (seconds) — set here, NOT inherited from the case, so
  # the dataset's time setup is controlled entirely by this file.
  simulation_time: 1000.0
  output_frequency: 5.0
  spinup_time: 200.0
  seed: 0

  # Backend-specific constant forcing. uDALES needs a streamwise pressure
  # gradient (the sampler only draws inflow_angle + velocity_magnitude); held
  # fixed across every member. Ignored by backends that don't consume it (e.g.
  # pylbm). Canonical value matches conf/params/static.yaml.
  pressure_gradient_magnitude: 0.0041912

  num_parallel_processes: 2

  # The sampler has three parts:
  #   seconds_per_knot: knot spacing of each parameter trajectory; a knot is
  #     placed every `seconds_per_knot` seconds over [0, simulation_time] (with
  #     a linearly-extrapolated final knot when the horizon isn't a multiple).
  #   external.<param>.{mean, std}: each may be a scalar (fixed for all sims) or
  #     a {min, max} dict (drawn uniformly per sim).
  #   time_series.*: hyperparameters of the AR(2)-relaxation generating the
  #     smooth fluctuation z(t). Per simulation: x(t) = mean_per_sim + std_per_sim * z(t).
  params_sampler:
    _target_: pyurbanair.training_data.UniformExternalAR2Sampler
    _convert_: all
    seconds_per_knot: 30.0
    external:
      inflow_angle:
        mean: {min: -25.0, max: 25.0}
        std: 5.0
      velocity_magnitude:
        mean: {min: 5.0, max: 10.0}
        std: 0.5
    time_series:
      correlation_length: 60.0
    ensemble_size: 1
