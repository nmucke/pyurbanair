# @package _global_

# defaults:
# #   - /neural_surrogate/architectures/unet_convnext@architecture: medium
#   - _self_

# model_name: unet_convnext_medium_test


defaults:
  - _self_
  # `mode` bundles everything that varies together -- the architecture default,
  # the trainer class, the loss and model_name -- so a single choice selects them
  # all: standard -> a non-DD architecture (unet_convnext/medium) + Trainer +
  # MSELoss; domain_decomposition -> domain_decomposed/medium + PatchTrainer +
  # DomainDecompositionLoss. Switch with `neural_surrogate/mode@_global_=standard`.
  # The architecture *size/family* is still swappable on the CLI on top of the
  # mode default, e.g. `neural_surrogate/architectures@architecture=p3d/large`.
  # `mode` must sit AFTER `_self_` so it overrides the inline `trainer:` block's
  # `_target_` below. The loss is defined entirely inside the mode file (there is
  # no `loss` group).
  # - /neural_surrogate/mode@_global_: domain_decomposition
  - /neural_surrogate/mode@_global_: standard

# The uDALES runs are periodic in the spanwise (y) direction: spatial convs
# wrap circularly along y instead of zero-padding. x stays non-periodic
# (inflow-outflow), z stays non-periodic (ground / domain top). This is a
# property of the data, so it lives here rather than in the architecture
# presets.
# architecture:
#   periodic_axes: [y]

# Optional warm start: path to a previously trained `weights.pt` state dict to
# initialize the model from before training (e.g. fine-tuning or continuing a
# run). The architecture must match. Set to null to train from scratch.
# Example: init_weights_path=model_weights/unet_convnext_medium/weights.pt
# init_weights_path: model_weights/unet_convnext_medium/weights.pt
# init_weights_path: model_weights/p3d_barcelona/weights.pt
init_weights_path: null

# Unified trainer config. neural_surrogates.Trainer (generic full-grid MSE /
# pushforward) and neural_surrogates.PatchTrainer (patch-based Eq (9) DD
# trainer) share all of this machinery via BaseTraining -- amp, torch.compile,
# channels-last, the warmup+cosine LR schedule, the pushforward-rollout
# curriculum, gradient clipping, early stopping and checkpoint/resume +
# metrics.csv logging. The class is selected by the `mode` group (see above),
# which overrides the `_target_` below; the domain_decomposition mode also needs
# a `domain_decomposed` architecture whose forward accepts return_intermediates.
trainer:
  # Overridden by the `mode` group (standard -> Trainer, domain_decomposition ->
  # PatchTrainer). This value only applies if no mode is selected.
  _target_: neural_surrogates.Trainer
  num_epochs: 200
  device: cuda
  patience: 15
  # Mixed precision autocast. bf16 needs no grad scaling and cannot
  # underflow; the trainer falls back to fp16 (+ GradScaler) on GPUs
  # without bf16 support.
  amp: true
  amp_dtype: bfloat16
  # torch.compile the model (static conv stack -> good fusion win). First
  # batch pays one-off compilation latency. Multi-geometry caveat: P3D needs
  # dynamic=False (backward stride assert), so every distinct grid shape
  # triggers a recompile -- fine for the idealized pool (14 shapes at 2 m),
  # impractical for the realistic pool (~98 shapes; keep this false there).
  compile_model: false
  # channels-last-3d memory layout for cuDNN kernel selection under
  # autocast. A/B this on the training GPU; correctness is unaffected.
  channels_last: false
  # cuDNN conv-algorithm autotuning. With a fixed grid + (drop_last) batch
  # shape cuDNN benchmarks once on the first step and reuses the fastest
  # kernels. On multi-geometry runs it re-tunes once per distinct
  # (grid, batch-size) pair -- a bounded first-epoch cost, then the same win.
  cudnn_benchmark: true
  # Run fp32 matmul/conv on Ampere+ tensor cores (TF32). Slightly lower mantissa
  # precision; immaterial next to the bf16 autocast already in use.
  tf32: true
  # Rollout-length curriculum: begin with `pushforward_start_steps`-step
  # rollouts and add one step every `pushforward_epochs_per_step` epochs, up to
  # `dataset.pushforward_steps`. The Eq (9) terms (PatchTrainer) are evaluated
  # on the final rollout step. Set the cadence to null to train at a fixed
  # horizon (the original pushforward behavior).
  pushforward_epochs_per_step: 10
  pushforward_start_steps: 1
  # Warmup + cosine LR schedule: ramp from `lr_warmup_start` up to the
  # optimizer's peak LR over `lr_warmup_epochs`, then cosine-anneal to `lr_min`
  # over the remaining epochs. Set `lr_warmup_epochs` to null to disable.
  lr_warmup_epochs: 5
  lr_warmup_start: 1.0e-6
  lr_min: 1.0e-6
  # Restrict the loss to fluid cells (uDALES targets carry junk values inside
  # obstacles). On the PatchTrainer path the DomainDecompositionLoss handles
  # fluid masking itself (its own `mask_loss` in the domain_decomposition mode),
  # so this trainer-level flag is unused there.
  mask_loss: true
  # Global grad-norm clip; set null to disable.
  grad_clip_norm: 1.0
  # Backprop through the last N unroll steps (1 = pure pushforward trick;
  # the earlier steps always run no-grad).
  grad_unroll_steps: 2
  # Continue from <weights dir>/checkpoint.pt (model + optimizer + scheduler +
  # scaler + curriculum state). Per-epoch metrics are appended to
  # <weights dir>/metrics.csv.
  resume: true
  # Write the full checkpoint every N epochs (plus the last one) instead of
  # every epoch -- the optimizer state is ~2x the model size, so the per-epoch
  # write is a synchronous disk stall. Best weights are still saved on every val
  # improvement; this only coarsens resume granularity.
  checkpoint_every: 5

# Alternative tuning that has worked well: torch.optim.AdamW with
# weight_decay: 1.0e-6, patience: 25, dataloader.batch_size: 64.
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1e-8

dataset:
  # The dd_patch (PatchTrainer) + dd loss path trains on FULL-FIELD transition
  # batches: the DomainDecomposed model tiles the field into patches internally
  # and exposes every patch's neighbours via return_intermediates=True, which is
  # what the Eq (9) interface/divergence terms need. Use TransitionDataset here.
  # PatchTransitionDataset is a separate one-step, delta-only per-patch path
  # whose items (state_n_patch/delta_target/...) lack the full-field state_n the
  # trainer reads -- selecting it here raises `KeyError: 'state_n'`.
  _target_: neural_surrogates.TransitionDataset
  # _target_: neural_surrogates.PatchTransitionDataset
  # root_dir may be a single-geometry dataset (barcelona / xie_and_castro) or a
  # multi-geometry one (geometry.source idealized/realistic, one grid+geometry
  # per trajectory). The dataset handles both without extra arguments --
  # geometry, SDF features and normalization stats are per-trajectory, and
  # equal masks are deduped so single-geometry runs behave exactly as before.
  # Multi-geometry roots additionally REQUIRE the batch_sampler block below.
  # root_dir: training_data/pyudales_medium
  root_dir: /export/scratch1/ntm/pyurbanair/training_data/pyudales_idealized
  # root_dir: /export/scratch1/ntm/pyurbanair/training_data/pyudales_medium
  # root_dir: /export/scratch1/ntm/pyurbanair/training_data/pypalm_barcelona
  # root_dir: /export/scratch1/ntm/pyurbanair/training_data/pypalm_realistic
  state_vars:
    - u
    - v
    - w
  param_vars: null
  cache: false
  dtype: float32
  pushforward_steps: 7
  # SDF + ∇SDF geometry features (see neural_surrogates.sdf): when true, the
  # dataset ships 4 extra channels (clamped signed distance + unit gradient)
  # alongside the `blanking` mask, computed once per geometry at init. Must be
  # paired with an architecture built with `sdf_features=true` (the train script
  # cross-checks this, and that the two `sdf_clamp_cells` agree). Default false
  # keeps items byte-identical to the pre-feature dataset.
  sdf_features: true
  # Clamp radius L (in cells) for the normalised SDF channel: clip(sdf, -L, L)/L.
  sdf_clamp_cells: 32

# Optional trajectory-bucketed batch sampler.
#
# WHEN TO SET IT:
#   * REQUIRED for multi-geometry datasets (root_dir produced by
#     generate_random_geometries_training_data.py, i.e. geometry.source
#     idealized/realistic): every trajectory has its own grid + geometry, so
#     plain shuffled batches cannot be stacked -- each batch must come from a
#     single trajectory, which is exactly what this sampler does. Batches are
#     shuffled across trajectories each epoch, so geometries still mix.
#   * Leave null for single-geometry datasets (barcelona / xie_and_castro):
#     the plain shuffled DataLoader path below is used, exactly as before.
#
# When set, the sampler REPLACES the dataloader's batch_size / shuffle /
# drop_last (PyTorch forbids combining them with a batch sampler; the train
# script neutralises them automatically -- you don't need to edit the
# dataloader block). The val loader reuses this block with shuffle forced off.
#
# Arguments:
#   batch_size   -- upper bound on samples per batch. At least one of
#                   batch_size / cell_budget must be set; with both, the
#                   smaller bound wins per trajectory.
#   cell_budget  -- upper bound on TOTAL grid cells per batch: a trajectory on
#                   N cells gets batches of max(1, cell_budget // N). This is
#                   what keeps GPU memory flat when domain sizes vary (the
#                   UrbanTALES realistic pool spans ~25x in cell count). Set it
#                   to batch_size * cells-per-sample of a known-good
#                   single-geometry run, e.g. 4 * (128*128*64) = 4194304.
#   shuffle      -- shuffle within trajectories + batch order across them
#                   (seeded, advances per epoch). Default true; the script
#                   forces false for the val loader.
#   drop_last    -- drop each trajectory's final short batch so batch shapes
#                   stay fixed per trajectory (less torch.compile /
#                   cudnn-benchmark churn). A trajectory with fewer samples
#                   than its batch size is then dropped entirely.
#   seed         -- base seed for the per-epoch shuffles.
# batch_sampler: null
batch_sampler:
  _target_: neural_surrogates.TrajectoryBatchSampler
  batch_size: 4
  cell_budget: 4194304
  shuffle: true
  drop_last: true
  seed: 0

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 4
  shuffle: true
  # Drop the final short batch so every step sees the same batch size. A
  # varying batch size forces torch.compile to recompile -- and P3D in
  # particular folds the batch into its window-attention reshapes, so a
  # different batch size cascades into many internal recompiles. Keeping the
  # batch size fixed keeps compilation static and fast. Applies to train and
  # val; with thousands of pairs per split, dropping the last partial batch is
  # negligible.
  drop_last: true
  # Workers overlap the per-sample netCDF reads with GPU compute;
  # pin_memory enables async host->GPU copies. persistent_workers keeps the
  # worker pool (and its per-process netCDF handle cache) alive across epochs
  # instead of re-forking every epoch; the trainer recreates the loader only
  # when the pushforward curriculum advances the horizon, so workers still pick
  # up the new horizon (see BaseTraining._refork_loader).
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  # Ship the (identical-within-each-batch) geometry mask once per batch as
  # (1, *grid) instead of B redundant copies. Fails loud on a mixed-geometry
  # batch (use batch_sampler above for multi-geometry datasets).
  collate_fn:
    _target_: neural_surrogates.datasets.transition.transition_collate
    _partial_: true
