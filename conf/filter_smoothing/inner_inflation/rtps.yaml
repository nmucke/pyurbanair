# @package filter_smoothing
# Relaxation to prior spread (Whitaker & Hamill 2012) in the inner state filter:
# posterior anomalies are rescaled so each row's spread relaxes a fraction
# `alpha` of the way back toward the prior spread. The usual default for EnKF
# cycling, and the default here — the inner pass cycles through `num_cycles`
# analyses per ESMDA iteration, so it collapses without spread maintenance.
# Selected with `filter_smoothing/inner_inflation=rtps` (the default).
inner_inflation:
  _target_: data_assimilation.inflation.RTPS
  alpha: 0.6
