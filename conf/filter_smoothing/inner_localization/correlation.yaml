# @package filter_smoothing
# Adaptive correlation-based localization (Vossepoel et al. 2025,
# MWR-D-24-0269.1) for the INNER state filter — the same strategy the ESMDA
# smoother and the EnKF use (conf/esmda/localization/correlation.yaml,
# conf/filtering/localization/correlation.yaml), reused unchanged and mounted
# under `filter_smoothing.inner_localization`. Select with
# `filter_smoothing/inner_localization=correlation`.
#
# This localizes the per-cycle STATE analysis only. The outer trajectory update's
# localization axis is the separate `filter_smoothing/temporal_localization`
# group.
inner_localization:
  _target_: data_assimilation.localization.correlation.CorrelationLocalization
  # Correlation truncation threshold rho_t. null -> theoretical 3/sqrt(N_e).
  truncation_correlation: 0.35
  # Fraction of the truncation distance left un-tapered (beta in Eq. 9).
  tapering_beta: 0.5
  # Maximum error-variance inflation E_max at the truncation distance.
  max_inflation: 8.0
  # Grid-block joint analysis: co-located state rows (u/v/w at one cell) share
  # one observation selection + transition.
  block_grouping: true
