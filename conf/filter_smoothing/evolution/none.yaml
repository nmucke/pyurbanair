# @package filter_smoothing
# No parameter evolution at the moving window's leading edge: when the window
# slides, each new knot is a plain copy of the last carried knot per member
# (IdentityEvolution). The trajectory ensemble's spread at the leading edge then
# comes only from the carried posterior spread and the outer ESMDA tempering, so
# with many windows the leading edge can arrive already over-confident — that is
# what `filter_smoothing/evolution=random_walk` exists to fix.
#
# `null` rather than an explicit IdentityEvolution `_target_`, mirroring
# conf/filtering/evolution/none.yaml (which spells "no evolution" as
# `parameter_evolution: null`): the script passes `evolution=None` straight
# through and `run_moving_window` applies its own IdentityEvolution default, so
# the two spellings are the same object either way.
#
# Ignored when `filter_smoothing.num_windows=1` (the single fixed window never
# appends a knot).
# Selected with `filter_smoothing/evolution=none` (the default).
evolution: null
