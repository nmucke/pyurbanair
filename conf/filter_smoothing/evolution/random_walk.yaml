# @package filter_smoothing
# Additive Gaussian random walk at the moving window's leading edge:
# theta_new = theta_last + xi, applied per member to the last carried knot each
# time the window slides (`window_shift` draws per slide, chained). The same
# class the filter's `filtering/evolution=random_walk` uses, but note the
# CADENCE differs: there it fires once per assimilation cycle, here once per
# appended KNOT — i.e. `window_shift` times per window, not `num_cycles` times.
#
# This is the leading edge's prior spread. IdentityEvolution
# (`filter_smoothing/evolution=none`) copies the carried knot, so the new knot
# enters with the posterior spread of the knot before it and the trajectory can
# tighten faster than the truth actually drifts; a random walk re-opens it at a
# rate you control. Scale `std` against how much the parameter genuinely moves
# in one cycle (`time.simulation_time` seconds), not against its prior width.
#
# `std` is one scalar for every estimated parameter, or a per-parameter mapping
# — parameters absent from the mapping receive NO noise, so a mapping keyed on
# names that `params_to_estimate` no longer selects degrades silently to
# identity:
#   filter_smoothing.evolution.std='{inflow_angle: 2.0, velocity_magnitude: 0.1}'
#
# Ignored when `filter_smoothing.num_windows=1` (the single fixed window never
# appends a knot).
# Selected with `filter_smoothing/evolution=random_walk`.
evolution:
  _target_: data_assimilation.filtering.parameter_evolution.RandomWalkEvolution
  std: 0.5
