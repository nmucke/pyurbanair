# @package filter_smoothing
# Temporal localization of the OUTER trajectory update (plan §7, Eq. 17): the
# same Vossepoel taper as the spatial strategies, with the knot-to-observation
# separation |t_knot - t_obs| as the distance.
#
# UNITS: CYCLES, not seconds. FilterSmoothingESMDA builds the coordinates on the
# cycle index — knot j sits at t_j = j (segment start) and observation batch k at
# t = k + 1 (segment end) — so the knot that actually drove segment k is exactly
# 1.0 away from its own observation batch. Consequences worth internalizing
# before retuning `temporal_radius`:
#   * < 1.0  excludes EVERY observation from every knot and freezes the
#            trajectory at the prior. Never useful.
#   * 1.0    keeps only each knot's own batch, and even that at maximum taper.
#   * 3.0    (this default) a three-cycle memory: a knot is informed by the
#            batches up to three cycles either side of it.
# The radius does NOT scale with time.simulation_time — a longer cycle makes each
# unit of radius cover more seconds, but the cycle-counted radius is unchanged.
#
# Deliberately SYMMETRIC in time — a later observation batch may still update an
# earlier knot, which is the whole point of smoothing the trajectory. The taper
# suppresses spurious long-range sampling correlations, not causality.
#
# Select with `filter_smoothing/temporal_localization=taper`. Orthogonal to
# `filter_smoothing/inner_localization` (state rows within a cycle): both may be
# on at once. Note this strategy is valid ONLY on the outer update — passing it
# as an inner localization is rejected at construction, since the inner filter's
# rows are state cells and would be tapered by a meaningless |x - t|.
temporal_localization:
  _target_: data_assimilation.filter_smoothing.TemporalLocalization
  # Truncation distance in CYCLES (see above). Observation batches further than
  # this from a knot contribute nothing to it.
  temporal_radius: 3.0
  # Fraction of the radius left un-tapered (beta in Eq. 9) — inside
  # beta*temporal_radius (1.5 cycles here) an observation enters at full weight.
  tapering_beta: 0.5
  # Maximum error-variance inflation E_max reached at the radius.
  max_inflation: 4.0
  # Keep FALSE. `ParamAugmentation.group_ids` blocks are "all knots of ONE
  # parameter", and every row in a block shares a single observation selection —
  # which would erase the temporal taper exactly within the axis this strategy
  # exists to localize. Localize each {name}_{t} row on its own instead. (The
  # grouping is supported by the strategy for symmetry with the spatial ones,
  # where a block is a co-located u/v/w triple and sharing is the point.)
  block_grouping: false
