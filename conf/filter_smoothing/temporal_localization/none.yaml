# @package filter_smoothing
# No temporal localization: the OUTER trajectory update is global in time, so
# every observation batch in the window may update every knot of Theta. This is
# the plain windowed ESMDA of the plan's §4.3 and the default — turn on
# `filter_smoothing/temporal_localization=taper` when the window is long enough
# that far-apart knot/observation pairs are dominated by sampling noise.
# Independent of `filter_smoothing/inner_localization`, which acts on the state
# rows inside each cycle.
# Selected with `filter_smoothing/temporal_localization=none` (the default).
temporal_localization: null
