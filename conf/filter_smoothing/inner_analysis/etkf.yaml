# @package filter_smoothing
# Global deterministic ensemble-transform (ETKF) analysis for the INNER state
# filter (see conf/filtering/analysis/etkf.yaml — same class, same semantics,
# mounted under `filter_smoothing.inner_analysis`). One symmetric square-root
# transform per cycle is right-multiplied onto the forecast anomalies, so no
# perturbed observations are drawn inside the window.
#
# Note this pairs naturally with `filter_smoothing.common_inner_noise=true`: a
# deterministic inner analysis already makes the map Θ -> D noise-free, which is
# exactly the property the common-random-numbers default buys for the stochastic
# scheme.
#
# REQUIRES `filter_smoothing/inner_localization=none`: the scheme declares
# localization_policy="forbidden" and the inner BaseFilter rejects the pair at
# construction. Use `filter_smoothing/inner_analysis=letkf` for a localized
# deterministic inner update. Select both groups explicitly rather than relying
# on whatever `filter_smoothing/inner_localization` the defaults list resolves to:
#   python scripts/filter_smoothing/run_filter_smoothing.py \
#     filter_smoothing/inner_analysis=etkf filter_smoothing/inner_localization=none
# Selected with `filter_smoothing/inner_analysis=etkf`.
inner_analysis:
  _target_: data_assimilation.filtering.etkf.ETKFAnalysis
  # Observation-space spectral truncation (nested ObservationTSVD block).
  # null -> keep every thin-SVD direction of the whitened observation anomalies,
  # i.e. the untruncated ETKF. Select filter_smoothing/inner_analysis=etkf_tsvd
  # for the truncated variant.
  tsvd: null
