# @package filter_smoothing
# Stochastic (perturbed-observation) EnKF analysis for the INNER state filter —
# the same option as conf/filtering/analysis/stochastic.yaml, mounted under the
# `filter_smoothing.inner_analysis` key. It only affects the per-cycle state
# update inside each ESMDA iteration; the OUTER trajectory update is always the
# tempered stochastic update (with `filter_smoothing/temporal_localization` as
# its localization axis).
# Selected with `filter_smoothing/inner_analysis=stochastic` (the default). This
# scheme declares localization_policy="optional", so it composes with any
# `filter_smoothing/inner_localization` choice.
inner_analysis:
  _target_: data_assimilation.filtering.analysis.StochasticEnKFAnalysis
