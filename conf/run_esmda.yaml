# Primary config (entry point) for scripts/esmda/run_esmda.py — the single ESMDA entry
# point that replaces run_{parameter,state_and_parameter,rollout,
# time_varying_parameter,time_varying_parameters_rollout}_esmda.py.
#
# Self-contained: this file inlines the shared base (output paths, time knobs,
# ensemble defaults, the `run:` namespace and Hydra settings) and selects the DA
# groups. The inlined defaults below are medium-sized; override the compute knobs
# on the CLI (e.g. `esmda.num_assimilation_windows=3`). See conf/README.md.
#
# Declarative axes select the mode:
#   * esmda/smoother=static|state_and_parameter|dynamic|state_and_dynamic
#       static             -> parameter-only, static params
#       state_and_parameter-> joint time=0 state + static params
#       dynamic            -> parameter-only, time-varying (AR(2)) params
#       state_and_dynamic  -> joint time=0 state + time-varying params
#   * params@prior_params=static|dynamic                          (static vs time-varying)
#   * esmda.num_assimilation_windows=1|N                          (single window vs rollout)
# and the truth source:
#   * run.truth_dir=null   -> simulate truth inline (default)
#   * run.truth_dir=<path> -> load a state.nc/params.nc artifact
#                             (as written by run_forward_model.py)
#
# The model group is mounted twice (model@truth_model / model@assim_model) and
# the params group is mounted twice (params@truth_params / params@prior_params);
# keeping the truth and prior samplers as separate configs is what avoids the
# inverse crime. There is deliberately no base `model`/`params` mount — this run
# only uses the truth/assim and truth/prior pairs.
#
# Examples::
#
#   python scripts/esmda/run_esmda.py esmda/smoother=static \
#     params@prior_params=static params@truth_params=static_truth
#   python scripts/esmda/run_esmda.py esmda/smoother=state_and_parameter \
#     params@prior_params=static esmda.num_assimilation_windows=3
#   python scripts/esmda/run_esmda.py esmda/smoother=state_and_dynamic \
#     params@prior_params=dynamic params@truth_params=dynamic_truth \
#     esmda.num_assimilation_windows=3
defaults:
  - case: xie_and_castro
  # `_self_` here (before the esmda/* groups) so the base `esmda:` scalars below
  # are set first and the localization / state_reduction / smoother groups can
  # override them (esmda.localization etc.). The model / params mounts write to
  # their own packages, so their position relative to `_self_` is immaterial.
  - _self_
  - esmda/localization: correlation
  - esmda/state_reduction: none
  - esmda/smoother: dynamic
  - model@truth_model: pyudales
  - model@assim_model: pyudales
  - params@truth_params: dynamic_sine
  - params@prior_params: dynamic

# --- Output roots (everything mutable lands under .temp/). This run mounts two
# models (truth/assim) and no base `model`, so name the output by both backends. ---
paths:
  results_dir: .temp/${truth_model.name}_to_${assim_model.name}
  # results_dir: /export/scratch2/ntm/${truth_model.name}_to_${assim_model.name}
  # Absolute scratch dir for the solvers (they chdir into it). Resolved from $PWD
  # so it also works under bare compose() in tests.
  experiment_dir: ${oc.env:PWD}/.temp
  # experiment_dir: /export/scratch2/ntm/temp
  base_results_dir: .temp_lbm

# --- Time-varying parameter knot spacing (per-window horizon lives in the case) ---
# The dynamic prior/truth take a new value every `seconds_per_knot` seconds; if a
# window length isn't a multiple of it, the last value is linearly extrapolated
# onto the window end. The dynamic smoother's `num_time_points` is derived from
# the resulting knot count by run_esmda.py.
time:
  seconds_per_knot: 60.0

# --- Which parameters ESMDA estimates -------------------------------------------
# Select which of the parameters defined in the params sampler configs
# (params@prior_params / params@truth_params) are included in the assimilation.
#   * list  -> estimate only the named parameters (the default below).
#   * null  -> estimate EVERY parameter the sampler configs define.
# Parameters left out are absent from the sampled prior/truth Datasets, so the
# forward models fall back to their construction-time/template defaults for them.
# The filter is applied to BOTH the prior and the truth samplers, so excluding a
# parameter reproduces the run as if that knob did not exist.
#
# The model-error compensation knobs vertical_inflow_exponent / sgs_constant
# (docs/esmda_model_error_parameters.md) are OFF by default: the default truth and
# assimilation models are the same solver (no model error to absorb), and a
# case-inappropriate sgs_constant can destabilize the solver (§8). Enable them for
# a CROSS-model study, after setting case-appropriate ranges in the params
# configs, e.g.:
#   params_to_estimate=[inflow_angle,velocity_magnitude,sgs_constant,vertical_inflow_exponent]
params_to_estimate:
  - inflow_angle
  - velocity_magnitude

# --- Ensemble execution. Override per run on the CLI, e.g.
# `ensemble.ensemble_size=128 ensemble.num_parallel_processes=8`. ---
ensemble:
  ensemble_size: 50
  num_parallel_processes: 8
  num_cpus_per_process: 1
  failure:
    policy: resample_from_successes
    jitter_scale: 0.05
    seed: 0

# --- ESMDA settings shared across the smoother modes. The smoother itself (the
# `_target_` block) is the one mode-specific piece, selected via the
# `esmda/smoother` group above. Localization and state reduction are config
# GROUPS (esmda/localization=none|correlation|distance,
# esmda/state_reduction=none|svd) that override `esmda.localization` /
# `esmda.state_reduction` below. ---
esmda:
  num_steps: 4
  alpha: ${.num_steps}
  num_assimilation_windows: 2
  seed: 42
  obs_error_std: 0.25
  # Observation aggregation: the time-resolved observations are binned into
  # contiguous `interval_seconds`-wide intervals and reduced within each by
  # `aggregation_mode` (mean|median|max|min) before the update sees them. null
  # `interval_seconds` -> full-resolution assimilation (every output frame).
  interval_seconds: 30.0
  aggregation_mode: mean
  # Defaults; normally set by the esmda/localization and esmda/state_reduction
  # groups (both default to `none`). Incompatible with each other for the state
  # update (the reduced coefficients are nonlocal); see docs/reduced_state_da.md.
  localization: null
  state_reduction: null
  # Optional post-loop Kalman smoothing of the full window trajectory (every time
  # step jointly) reusing the final posterior forecast — no extra forward solve,
  # parameters frozen. Requires state_reduction; state-bearing smoothers only.
  final_time_smoothing: false
  # Persist the observation-space arrays per window (windows/window_*_obs.nc,
  # *_pred_obs.nc, *_params_steps.nc): the assimilated observations, the
  # predicted observations at every ESMDA iteration (0 = prior, -1 = posterior
  # forecast) and the per-iteration parameter ensembles. These are the inputs to
  # the normalized data-mismatch diagnostic (run_summary.yaml's
  # `esmda_diagnostics`) and figure D3; they are KB-scale, so default-on. Set
  # false to reproduce the pre-phase-2 artifact set exactly — the diagnostic and
  # the figure then skip themselves. Costs one extra observation-operator
  # evaluation per window (the posterior forecast's), no extra forward solve;
  # under final_time_smoothing=true that forecast is evaluated twice, since the
  # smoothing step does its own and this one is deliberately taken before it.
  save_obs_diagnostics: true

run:
  skip_viz: false
  results_dir: null
  # When true, ensemble forecasts are written to disk (one NetCDF per member,
  # per ESMDA step) instead of one in-memory ensemble Dataset — keeps the full
  # field off host RAM for the high-resolution / large-ensemble sweeps.
  ensemble_save_on_disk: true
  # Whether to persist the per-window PRIOR ensemble state forecasts
  # (windows/window_*_prior_state.nc). The POSTERIOR state and the prior/posterior
  # PARAMETERS are always saved; the prior STATE ensemble is the large artifact
  # (one full-ensemble field per window), so set this false to roughly halve the
  # on-disk state footprint. Flip it per run on the CLI, e.g.
  # `run.save_prior_state=false`. Downstream prior-vs-posterior state diagnostics
  # (compute_sweep_metrics.py sensor series, visualize_state_run.py spread/increment
  # plots) detect the absent files and skip those comparisons, so they still run —
  # just without the prior curves/panels.
  save_prior_state: false
  # Truth source: null -> simulate inline (default); a path -> load a
  # state.nc/params.nc artifact written by run_forward_model.py params=dynamic.
  truth_dir: null # ground_truth/barcelona
  # Begin the assimilation horizon partway into a disk-loaded truth (skips a
  # spin-up): keep state + params from this time onward and rebase the time axis
  # so this time becomes t=0. null/0 -> start from the truth's first frame.
  truth_start_time: null

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.results_dir}/hydra/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
