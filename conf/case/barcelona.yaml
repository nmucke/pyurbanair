# @package _global_
#
# Case: Barcelona urban geometry.
#
# Select with `case=barcelona`. Bundles the domain bounds, sensor layout and STL
# geometry for the real Barcelona block into one switchable group. `size/` and
# `preset/` overlays deep-merge over the domain/obs below.

domain:
  # Grid + physical bounds, matched to the domain-frame STL produced by
  # tools/prepare_case_stl.py (full geometry; merged buildings+ground spans
  # [0, 906.09] x [0, 874.37] x [0, 84.75] m). Grid is isotropic dx=dy=dz=2 m.
  #
  # uDALES treats `bounds` as a CROP WINDOW into the STL (the mesh is translated
  # by -bounds_lower, never scaled), so to run a smaller/cheaper region just
  # narrow `bounds` to a sub-window in these metre coordinates and lower nx/ny/nz
  # to keep the resolution, e.g. a 200 m square at the centre:
  #   domain.bounds=[[353,553],[337,537],[0,128]] domain.nx=100 domain.ny=100 domain.nz=64
  # (nfcts still counts all STL facets; regenerate the STL with --size for fewer.)
  nx: 200
  ny: 200
  nz: 16
  bounds:
    - [0.0, 900.0]
    - [0.0, 870.0]
    - [0.0, 128.0]

geometry:
  # All three backends share ONE STL (produced by tools/prepare_case_stl.py) at
  # examples/<case>/buildings.stl. pylbm/pypalm read it directly via `stl_path`;
  # uDALES requires the STL inside its case dir, so examples/udales/barcelona/
  # holds a relative symlink to the shared file (dereferenced into the run dir at
  # prepare time — see libs/pyudales utils/file_utils.copy_files). `*_case_dir`
  # are the per-backend dirs holding backend-specific config files (uDALES
  # namoptions, PALM _p3d).
  stl_path: examples/barcelona/buildings.stl
  udales_case_dir: examples/udales/barcelona
  palm_case_dir: examples/palm/barcelona
  # Precomputed uDALES IBM geometry (solid_*/fluid_boundary_*/facet_sections_* +
  # geom_meta.json), generated by tools/preprocess_udales_geometry.py and saved
  # in this case folder. Reused instead of re-running the ~30+ min STL->IBM
  # Fortran classifier over the 422k-facet mesh. The bundle is grid-specific;
  # regenerate it if you change nx/ny/nz/bounds (a grid mismatch is caught via
  # geom_meta.json). Set to null to force generating from the STL.
  udales_precomputed_geom_dir: examples/udales/barcelona

obs:
  # Observation operator. Sensor coordinates are in the domain.bounds frame
  # (metres): x in [200, 1000], y in [250, 1050], z in [0, 128] (same frame as
  # the STL). They were placed by scripts/_place_barcelona_sensors.py against
  # examples/barcelona/buildings.stl: every sensor sits at street level (z=3 m)
  # in an open street canyon, >=6 m from the nearest building footprint in every
  # direction, so none is inside a building or directly in front of a facade
  # (robust to the varying inflow angle).
  mode: points

  x_points: [937.0, 263.0, 637.0, 325.0, 959.0]
  y_points: [311.0, 339.0, 647.0, 971.0, 985.0]
  z_points: [3.0, 3.0, 3.0, 3.0, 3.0]

  states: [u, v, w]
  temporal_mode: intervals
  interval_seconds: 20.0
  aggregation_mode: mean

time:
  # Per-window simulation horizon for this geometry (seconds). One assimilation
  # window is `simulation_time` long with a `spinup_time` constant-inflow plateau
  # in front; the state is written every `output_frequency` s. The number of
  # windows and the param-knot count are compute knobs and live in `scale/`.
  simulation_time: 180.0
  output_frequency: 2.0
  spinup_time: 50.0
