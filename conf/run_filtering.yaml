# Primary config (entry point) for scripts/filtering/run_filtering.py — sequential
# ensemble filtering (EnKF) alongside the ESMDA entry point (run_esmda.yaml).
#
# Self-contained: inlines the shared base (output paths, ensemble defaults, the
# `run:` namespace and Hydra settings) and selects the filtering groups.
#
# Declarative axes select the mode and machinery:
#   * filtering.mode=state|parameter|joint     which blocks the analysis updates
#   * filtering/analysis=stochastic|etkf|etkf_tsvd|letkf|letkf_tsvd
#                                              the update math. etkf* REQUIRES
#                                              filtering/localization=none;
#                                              letkf* REQUIRES a non-null one.
#   * filtering/localization=none|correlation|distance
#   * filtering/state_reduction=none|svd_current|svd_streaming
#   * filtering/inflation=none|multiplicative|rtps|rtpp
#   * filtering/evolution=none|random_walk     parameter forecast model
#   * filtering.num_assimilation_windows=W     the horizon, in windows
# and the truth source (mirrors run_esmda.yaml):
#   * run.truth_dir=null   -> simulate truth inline (default)
#   * run.truth_dir=<path> -> load a state.nc/params.nc artifact
#
# The filter forecasts OBSERVATION TO OBSERVATION: one cycle = one observation
# interval of `time.output_frequency` seconds, ending in one full-weight
# analysis of that frame. Unlike the smoothers, the filter never aggregates.
# Windows are the same unit as ESMDA's (`esmda.num_assimilation_windows`), so
# the two entry points are configured identically for like-for-like runs: one
# window = `time.simulation_time` seconds, the horizon is
# `num_assimilation_windows * simulation_time`, and the cycles per window are
# DERIVED as `simulation_time / output_frequency`. Windows are purely
# computational/IO chunking (one `run()` call and one set of per-window
# artifacts each) — the cycle chain is carried across them unchanged, so a
# horizon run as 1 window and as W windows is mathematically identical.
# The PRIOR must be STATIC (pair with params@prior_params=static):
# the filter estimates a scalar it re-tracks each cycle, so a time-varying (AR(2))
# posterior stays with run_esmda.py. The TRUTH may be dynamic
# (params@truth_params=dynamic_truth) -- the filter then tracks a drifting truth,
# its scalar estimate following the truth's per-cycle value (the default here).
#
# Examples::
#
#   python scripts/filtering/run_filtering.py filtering.mode=joint \
#     filtering.num_assimilation_windows=4
#   python scripts/filtering/run_filtering.py filtering.mode=parameter \
#     filtering/evolution=random_walk filtering/inflation=none
#   python scripts/filtering/run_filtering.py filtering.mode=state \
#     filtering/localization=correlation
#   python scripts/filtering/run_filtering.py filtering.mode=state \
#     filtering/localization=none filtering/state_reduction=svd_current
#   python scripts/filtering/run_filtering.py filtering.mode=state \
#     filtering/analysis=etkf filtering/localization=none
#   python scripts/filtering/run_filtering.py filtering.mode=state \
#     filtering/analysis=letkf filtering/localization=distance
defaults:
  - case: xie_and_castro
  # `_self_` before the filtering/* groups so the base `filtering:` scalars below
  # are set first and the analysis / localization / inflation / evolution groups
  # can override them. The model / params mounts write to their own packages.
  - _self_
  - filtering/analysis: stochastic
  - filtering/localization: none
  - filtering/state_reduction: none
  - filtering/inflation: rtps
  - filtering/evolution: none
  - model@truth_model: pyudales
  - model@assim_model: pyudales
  # Mixed drift-tracking default: a time-varying (dynamic) TRUTH the filter
  # tracks with a STATIC scalar prior it re-analyses each cycle. The prior MUST
  # be static (params@prior_params=static) -- a dynamic prior belongs to the
  # ESMDA smoothers. Set params@truth_params=static_truth for a constant truth.
  - params@truth_params: dynamic_truth
  - params@prior_params: static

# --- Output roots (everything mutable lands under .temp/). Two model mounts
# (truth/assim) and no base `model`, so name the output by both backends. ---
paths:
  results_dir: .temp/filtering_${truth_model.name}_to_${assim_model.name}
  # Absolute scratch dir for the solvers (they chdir into it). Resolved from $PWD
  # so it also works under bare compose() in tests.
  experiment_dir: ${oc.env:PWD}/.temp
  base_results_dir: .temp_lbm

# --- Time-varying parameter knot spacing. NOT used by the filter itself (only
# static parameters are supported), but the dynamic params sampler configs
# interpolate it — keeping the key here lets a dynamic mount compose (and fail
# with the script's explicit static-only error instead of a missing-key one),
# and keeps shared overrides (tests) portable across the run_* entry points. ---
time:
  seconds_per_knot: 60.0

# --- Which parameters the filter estimates (same contract as run_esmda.yaml
# `params_to_estimate`: a list -> that subset of the sampler configs' params,
# applied to BOTH prior and truth; null -> every parameter they define). ---
# The mixed default's dynamic truth (conf/params/dynamic_truth.yaml) only varies
# inflow_angle and velocity_magnitude, so estimate those (a parameter absent from
# the truth would be tracked against no reference). Add others when the truth
# sampler defines them.
params_to_estimate:
  - inflow_angle
  - velocity_magnitude

# --- Ensemble execution. Override per run on the CLI, e.g.
# `ensemble.ensemble_size=128 ensemble.num_parallel_processes=8`. ---
ensemble:
  ensemble_size: 32
  num_parallel_processes: 8
  num_cpus_per_process: 1
  failure:
    policy: resample_from_successes
    jitter_scale: 0.05
    seed: 0

# --- Filtering settings. The filter itself (the `_target_` block) composes the
# analysis / localization / state reduction / inflation / evolution selected by
# the groups above;
# `filtering.mode` picks which augmented blocks the analysis updates. ---
filtering:
  # Assimilation windows, exactly as `esmda.num_assimilation_windows`: one
  # window spans `time.simulation_time` seconds, so the experiment horizon is
  # `num_assimilation_windows * time.simulation_time`. The cycles are DERIVED,
  # not configured: one cycle is one observation interval
  # (`time.output_frequency` s) ending in one full-weight analysis, so a window
  # holds `time.simulation_time / time.output_frequency` of them (divided by
  # `assimilate_every_n_step`, below). Still no aggregation knobs: the filter
  # assimilates individual frames and never averages them — aggregation stays
  # with the ESMDA smoothers and the filter-smoothing hybrid.
  #
  # A window boundary is a CHUNKING boundary only (one `run()` call and one set
  # of per-window artifacts each, so RAM and peak disk stay bounded): the
  # analyzed state, the parameters, the filter's PRNG stream and the per-cycle
  # observation-noise draws are all carried across it, so the same horizon run
  # as 1 window or as W windows gives identical results. Keep W in the ESMDA
  # range (2-10) for comparable runs and readable per-window diagnostics.
  num_assimilation_windows: 2
  # Analysis STRIDE: assimilate only every n-th observation frame (1 = every
  # frame, the every-observation filter above; n > 1 thins the analyses without
  # touching the model's output cadence). A cycle then spans
  # `n * time.output_frequency` seconds and assimilates the LAST frame of its
  # segment — the analysis time; the intermediate frames are still SIMULATED
  # and still written out (they are in the per-cycle
  # `_ensemble_states/cycle_{k}/` segments in full), they just never see a
  # Kalman step, so the ensemble runs n intervals between analyses. The
  # in-memory histories (state_history.nc, the per-window state files) hold the
  # analysis-time frames only. `n` MUST divide
  # `time.simulation_time / time.output_frequency` so the cycles still tile a
  # window; the run refuses to start otherwise.
  assimilate_every_n_step: 1
  seed: 42
  obs_error_std: 0.25
  # state | parameter | joint. The parameter-updating modes (parameter and
  # joint) REQUIRE spread maintenance (filtering/evolution=random_walk or a
  # filtering/inflation option) — the filter refuses silently-collapsing
  # configurations at construction.
  mode: joint
  # Defaults; normally set by the filtering/* groups above.
  analysis: stochastic
  localization: null
  state_reduction: null
  inflation: null
  parameter_evolution: random_walk
  filter:
    _target_: data_assimilation.filtering.EnsembleKalmanFilter
    _convert_: all
    mode: ${filtering.mode}
    analysis: ${filtering.analysis}
    localization: ${filtering.localization}
    state_reduction: ${filtering.state_reduction}
    inflation: ${filtering.inflation}
    parameter_evolution: ${filtering.parameter_evolution}

run:
  # Read by the shared ESMDA metric/figure stages when they are pointed at a
  # filtering run directory (they gate their state/sensor/field blocks on it);
  # the filtering-specific stages ignore it.
  skip_viz: false
  results_dir: null
  # When true, ensemble forecasts are written to disk (one NetCDF per member,
  # per cycle, under cycle_{k}/ dirs) instead of one in-memory ensemble Dataset.
  ensemble_save_on_disk: false
  # Save the per-cycle analyzed params/state histories (params_history.nc /
  # state_history.nc; the state history holds final frames only, so it stays
  # small). Per-cycle diagnostics (cycle_diagnostics.yaml) are always saved.
  save_history: true
  # Truth source: null -> simulate inline (default); a path -> load a
  # state.nc/params.nc artifact written by run_forward_model.py.
  truth_dir: null
  # Begin the assimilation horizon partway into a disk-loaded truth (skips a
  # spin-up): frames before this time are dropped and the axis rebased so it
  # becomes t=0. null/0 -> start from the truth's first frame.
  truth_start_time: null

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.results_dir}/hydra/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
