# Fixed truth realization for the same-model persistent SGS discrepancy
# recovery experiment. The corresponding prior is augmented from
# assim_model.forward_model.model_discrepancy.prior_std at runtime.
_target_: pyurbanair.static_parameters.ParameterSampler
_convert_: all
seed: 0
parameters:
  sgs_bias_b0:
    _target_: pyurbanair.static_parameters.Constant
    value: 0.10
  sgs_bias_b1:
    _target_: pyurbanair.static_parameters.Constant
    value: -0.12
  sgs_bias_b2:
    _target_: pyurbanair.static_parameters.Constant
    value: 0.08
