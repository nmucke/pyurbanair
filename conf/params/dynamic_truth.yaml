# Time-varying TRUTH parameters. Same AR2RelaxationModel as the dynamic prior,
# but with distinct external means / seed so the truth trajectory is not drawn
# from the assimilation prior's generative process (anti-inverse-crime).
# Mounted as `params@truth_params` by run_esmda.yaml; the assimilation prior is
# the separate `params@prior_params=dynamic`.
_target_: pyurbanair.dynamic_parameters.ar2_relaxation.AR2RelaxationModel
_convert_: all
correlation_length: 200.0
seed: 7
external_parameters:
  inflow_angle:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.0
    std: 6.0
  velocity_magnitude:
    _target_: pyurbanair.static_parameters.Normal
    mean: 7.5
    std: 0.5
    min: 0.1
# Truth-model values for the constant-in-time model-error knobs (Constants so the
# truth realization is fixed). The truth solver may differ from the assimilation
# solver, so these need not match conf/params/dynamic.yaml's prior means.
static_parameters:
  vertical_inflow_exponent:
    _target_: pyurbanair.static_parameters.Constant
    value: 0.25
  # sgs_constant is NOT set here on purpose: it now defaults per-backend in
  # conf/model/*.yaml, because the three solvers' SGS constants are different
  # physical quantities (uDALES/pylbm dimensionless; PALM m^2/s). Re-add it here
  # ONLY to have ESMDA estimate it, and only for a single-backend run.
# See conf/params/dynamic.yaml — knots are spaced `seconds_per_knot` seconds.
simulation_time: ${time.simulation_time}
seconds_per_knot: ${time.seconds_per_knot}
