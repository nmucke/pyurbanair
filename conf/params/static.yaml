_target_: pyurbanair.static_parameters.ParameterSampler
_convert_: all
seed: 42
parameters:
  inflow_angle:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.0
    std: 10.0
  # Kept identical to the AR(2) prior's external distribution for this parameter
  # (conf/params/dynamic.yaml `external_parameters.velocity_magnitude`), so a
  # filter run (static prior, required) and a smoother run (dynamic prior) pose
  # the SAME inverse problem. That match is exact at every knot: the AR(2)
  # window-0 draw is x_ext + Sigma_ext * z with z ~ N(0, 1) stationary, so its
  # marginal is this Normal; the only remaining difference is that the dynamic
  # members vary smoothly in time while these stay constant. `inflow_angle`
  # above already matches. Change the two together.
  velocity_magnitude:
    _target_: pyurbanair.static_parameters.Normal
    mean: 7.5
    std: 0.5
    min: 0.1
  # Model-error compensation knobs (docs/esmda_model_error_parameters.md). Tight
  # priors: each extra free parameter risks an underdetermined inverse / ensemble
  # collapse with few sensors. Exclude them from a run via run_esmda.yaml
  # `params_to_estimate`.
  # Power-law shear exponent α: u(z) = u_ref (z/z_ref)^α.
  vertical_inflow_exponent:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.25
    std: 0.05
    min: 0.05
  # Sub-grid-scale mixing constant. Meaning is per-solver (LBM smagorinsky /
  # uDALES cs / PALM km_constant proxy), so set the range to the ASSIMILATION
  # model. Keep the prior near/above the solver's stable threshold — too little
  # SGS dissipation diverges the run (docs/esmda_model_error_parameters.md §8).
  # Default range targets the uDALES xie_and_castro case (tuned at cs=0.24).
  sgs_constant:
    _target_: pyurbanair.static_parameters.Normal
    mean: 0.22
    std: 0.03
    min: 0.18
  pressure_gradient_magnitude:
    _target_: pyurbanair.static_parameters.Constant
    value: 0.0041912
